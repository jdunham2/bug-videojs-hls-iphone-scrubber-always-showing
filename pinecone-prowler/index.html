<title>Pinecone Prowler</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a cozy, funny stealth game
   IDEA a 1990s provincial-park campground and its little logging town, seen from a tilted 3/4 camera like a diorama
   PICTURE the live world on canvas: pines, tents, buildings with walls and roofs, rangers' sight cones, Moss the forest giant
   COLOUR deep fir green ground, cedar-sign brown panels, campfire amber, ranger-cone yellow, alarm red
   TYPE Alfa Slab One (park signage) + Nunito
   LAYOUT one screen: canvas fills it; stats top-left, alert eye top-centre, quest top-right, backpack bottom; phones add joystick + buttons */
:root{color-scheme:dark;--bg:#13241a;--panel:rgba(48,32,20,.9);--panel2:#5b3b22;--edge:#8a5d36;--ink:#fbf3df;--dim:#e3d2b0;--moss:#8fd16a;--amber:#ffbf3c;--red:#ff5b4a;--sky:#6cd0ff}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.sign{background:var(--panel);border:2px solid var(--edge);border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.slab{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;letter-spacing:.01em}
#top{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#stats{padding:8px 12px;width:200px}
#clock{font-size:17px;white-space:nowrap}
.bar{height:9px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .2s}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:5px}
#vote{color:var(--red);font-weight:900;font-size:13.5px;margin-top:6px}
#eye{margin:0 auto;padding:6px 12px;display:flex;gap:8px;align-items:center;min-width:150px}
#eye svg{width:30px;height:20px;flex:none}
#eye .bar{flex:1;margin:0;height:10px}
#eyeTxt{font-size:13px;white-space:nowrap}
#quest{padding:8px 12px;width:260px}
#quest h3{margin:0;font-size:16px;color:var(--amber)}
#quest p{margin:2px 0 0;font-size:13.5px;color:var(--dim)}
#qside{color:var(--sky)!important;margin-top:5px!important}
#qprog{font-weight:900;color:var(--ink)}
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
#prompt{padding:5px 12px;font-weight:800;font-size:15px}
kbd{font:900 12px Nunito,sans-serif;background:var(--ink);color:#3b2614;border-radius:5px;padding:1px 6px;margin-right:4px}
#slots{display:flex;gap:6px;padding:6px;pointer-events:auto}
.slot{width:46px;height:46px;border-radius:9px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.12);display:grid;place-items:center;padding:4px;cursor:pointer}
.slot svg{width:34px;height:34px}
.slot:hover{border-color:var(--amber)}
#toasts{display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{padding:7px 14px;font-weight:800;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,14,10,.55);padding:16px}
#card{width:min(540px,100%);max-height:94%;overflow:auto;padding:18px 20px;user-select:text}
#card h2{margin:0 0 6px;font-size:28px;line-height:1.05;color:var(--amber)}
#card h1{margin:0;font-size:clamp(38px,9vw,60px);line-height:1;color:var(--moss);text-shadow:0 3px 0 #2c1a0d}
#card p{margin:8px 0;font-size:16px}
.who{font-weight:900;color:var(--sky)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:900 16px Nunito,sans-serif;border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--amber);color:#3b2614;cursor:pointer;box-shadow:0 3px 0 #9a6a12}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a12}
.btn.alt{background:#e9dcc0;box-shadow:0 3px 0 #9d8c6b}
.btn:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;margin-top:6px}
.grid .slot{width:auto;height:56px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.row svg{width:38px;height:38px;flex:none}
.row div{flex:1}
.row small{color:var(--dim);font-size:13.5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;margin-top:8px;color:var(--dim)}
/* line cook */
.ckhud{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:800;color:var(--dim);font-size:15px}
.ckhud b{color:var(--ink)}
#ckT{color:var(--amber);font-family:'Alfa Slab One',Georgia,serif;font-size:18px}
.cook{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px}
.ticket{background:#fbf3df;color:#3b2614;border-radius:4px;padding:10px 12px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.3);transform:rotate(-1.5deg)}
.ticket b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:17px}
.ticket ol{margin:6px 0 8px;padding-left:22px;font-size:15px}
.ticket li.done{text-decoration:line-through;opacity:.45}
.ticket li.now{color:#c4452f}
.ticket .bar{background:#e3d2b0}
.plate{position:relative;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:2px;min-height:170px;padding:14px 8px 24px;border-radius:12px;background:#2e3a34}
.plate::after{content:'';position:absolute;left:10%;right:10%;bottom:10px;height:20px;border-radius:50%;background:#f4f1ea;box-shadow:0 4px 0 #cfc8bb}
.lay{position:relative;z-index:1}
.plate.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.plate .lay{height:13px;border-radius:7px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}
.ing{display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 8px;border-radius:9px;border:2px solid var(--edge);background:var(--panel2);color:var(--ink);font:800 14px Nunito,sans-serif;cursor:pointer;text-align:left}
.ing:active{transform:translateY(2px)}
.ing i{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.25)}
.ing kbd{margin:0}
#ckMsg{min-height:22px;font-weight:900;color:var(--moss);margin:8px 0 0}
#touch{position:fixed;inset:auto 0 0 0;height:170px;pointer-events:none}
#joy{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);pointer-events:auto}
#nub{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(251,243,223,.55)}
#tbtns{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,62px);gap:10px;pointer-events:auto}
#tbtns button{width:62px;height:62px;border-radius:50%;border:2px solid var(--edge);background:var(--panel);color:var(--ink);font:900 13px Nunito,sans-serif}
#tbtns button:active{background:var(--panel2)}
body.touch #bottom{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
/* feast */
.feast{display:grid;gap:10px;margin-top:8px}
.face{position:relative;height:180px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(#7fb6d1,#b6e0ee 62%,#5f9346 62%)}
.face svg{height:170px;width:auto;overflow:visible}
#fMouthG{transform-box:fill-box;transform-origin:center;transition:transform .1s}
.face.open #fMouthG{transform:scale(1.5,2.6)}
.face.chomp #fMouthG{transform:scale(1.15,.3)}
.tabletop{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:90px;padding:14px;border-radius:10px;background:repeating-linear-gradient(90deg,#a96d3d 0 46px,#7a4c2a 46px 49px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.fitem{width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:#f4f1ea;box-shadow:0 3px 0 #cfc8bb;cursor:grab;touch-action:none;position:relative}
.fitem svg{width:44px;height:44px;pointer-events:none}
.fitem.drag{z-index:10;cursor:grabbing;box-shadow:0 12px 18px rgba(0,0,0,.45)}
.bagzone{padding:10px;border:2px dashed var(--edge);border-radius:10px;text-align:center;font-weight:800;color:var(--dim)}
.bagzone.hot{border-color:var(--amber);color:var(--ink);background:rgba(255,191,60,.12)}
#fMsg{font-weight:900;color:var(--moss);min-height:22px;margin:6px 0 0}
/* camera */
#vf{position:fixed;inset:0;pointer-events:none}
#vfFrame{position:absolute;width:220px;height:160px;transform:translate(-50%,-50%);background:rgba(255,255,255,.06);outline:1px solid rgba(251,243,223,.35)}
#vfFrame i{position:absolute;width:26px;height:26px;border:4px solid #fbf3df}
#vfFrame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#vfFrame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#vfFrame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#vfFrame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#vfFrame::after{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fbf3df;border-radius:50%}
#vfTag{position:absolute;left:-60px;right:-60px;top:calc(100% + 8px);text-align:center;font-weight:900;text-shadow:0 2px 0 #000}
#vfBar{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;pointer-events:auto}
body.touch #vfBar{bottom:calc(185px + env(safe-area-inset-bottom,0px))}
body.cammode #bottom{visibility:hidden}
#shot{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.photo{background:#fbf3df;color:#3b2614;padding:6px 6px 8px;border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.3);font-weight:800;font-size:13px}
.photo img{display:block;width:100%;aspect-ratio:11/8;object-fit:cover;background:#333}
.photo small{color:#7a6a50}
/* golf + caddy */
#golfCv{display:block;width:min(100%,calc((88vh - 240px)*.75));min-width:220px;margin:8px auto 0;aspect-ratio:3/4;border-radius:10px;touch-action:none;background:#3f7a3a}
.ghud{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:800;color:var(--dim)}
.ghud b{color:var(--ink)}
#gMsg{font-weight:900;min-height:22px;margin:6px 0 0;color:var(--moss)}
.clubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.lie{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;margin-top:8px;min-height:88px}
.lie svg{width:60px;height:60px;flex:none}
.lie b{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.lie span{color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.5)}
#sniff{padding:6px 12px;font-weight:900;font-size:14px}
#bag2{color:var(--ink);font-weight:800}
#fishCv{display:block;width:min(100%,calc((88vh - 230px)*.9));min-width:220px;margin:8px auto 0;aspect-ratio:9/10;border-radius:10px;touch-action:none}
#fkMsg{font-weight:900;min-height:44px;margin:6px 0 0;color:var(--moss)}
#skiCv,#diveCv{display:block;width:min(100%,calc((88vh - 240px)*.8));min-width:220px;margin:8px auto 0;border-radius:10px;touch-action:none}
#skiCv{aspect-ratio:3/4}#diveCv{aspect-ratio:6/7}
#dvMsg,#skMsg{font-weight:900;min-height:44px;margin:6px 0 0;color:var(--moss)}
#brow{display:flex;gap:6px;align-items:center;pointer-events:auto}
.hbtn{color:var(--ink);font:900 13px Nunito,sans-serif;padding:0 10px;height:58px;cursor:pointer}
.hbtn:active{background:var(--panel2)}
@media(max-width:640px){.hbtn{padding:0 6px;font-size:12px;height:50px}#stats{width:165px;padding:6px 10px}#quest{order:3;width:100%;max-width:340px}#eye{min-width:0;flex:1}#clock{font-size:15px}.slot{width:36px;height:36px;padding:3px}.slot svg{width:26px;height:26px}.ing{font-size:13px;padding:4px 6px}.ing kbd{display:none}}
@media(prefers-reduced-motion:reduce){.toast,.plate.shake{animation:none}}
</style>

<canvas id="cv"></canvas>

<div id="top">
  <div id="stats" class="sign">
    <div id="clock" class="slab">Day 1 · 7:00 AM</div>
    <div class="lbl"><span>Hunger</span><span id="hungerN">80</span></div>
    <div class="bar"><i id="hungerB" style="background:var(--moss);width:80%"></i></div>
    <div class="lbl"><span>Stamina</span><span id="coins">0 coins</span></div>
    <div class="bar"><i id="stamB" style="background:var(--sky);width:100%"></i></div>
    <div class="lbl" id="bag2" hidden></div>
    <div id="vote" hidden></div>
  </div>
  <div id="eye" class="sign">
    <svg viewBox="0 0 30 20"><path d="M1 10Q15-4 29 10Q15 24 1 10Z" fill="#fbf3df"/><circle cx="15" cy="10" r="5.5" fill="#3b2614"/><circle cx="16.5" cy="8.5" r="1.6" fill="#fff"/></svg>
    <div class="bar"><i id="eyeB" style="width:0;background:var(--amber)"></i></div>
    <span id="eyeTxt">Unseen</span>
  </div>
  <div id="sniff" class="sign" hidden></div>
  <div id="quest" class="sign">
    <h3 class="slab" id="qt">Say hi to Pip</h3>
    <p><span id="qd"></span> <span id="qprog"></span></p>
    <p id="qside" hidden></p>
  </div>
</div>

<div id="bottom">
  <div id="toasts"></div>
  <div id="prompt" class="sign" hidden></div>
  <div id="brow"><button id="mapBtn" class="sign hbtn" aria-label="Map">Map</button><div id="slots" class="sign"></div><button id="menuBtn" class="sign hbtn" aria-label="Menu">Menu</button></div>
</div>

<div id="touch" hidden>
  <div id="joy"><div id="nub"></div></div>
  <div id="tbtns">
    <button data-k="cam">Cam</button><button data-k="coat">Outfit</button><button data-k="eat">Eat</button>
    <button data-k="bark" id="barkBtn" style="visibility:hidden">Bark</button><button data-k="run" id="runBtn">Run</button><button data-k="act">Use</button>
  </div>
</div>

<div id="vf" hidden><div id="vfFrame"><i></i><i></i><i></i><i></i><span id="vfTag"></span></div><div id="vfBar"><button class="btn" id="vfSnap">Snap</button><button class="btn alt" id="vfExit">Exit camera</button></div></div>
<div id="shot"></div>
<div id="modal" hidden><div id="card" class="sign"></div></div>

<script>
{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const WW=3950,WH=1800,TAU=Math.PI*2,T=.72,gy=y=>y*T;
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const R=(a,b)=>a+rnd()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const segD=(px,py,ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-t*dx,py-ay-t*dy)};
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- food & outfits ---------- */
const FOOD={
 hotdog:{n:'Hot dog',h:25,svg:'<rect x="3" y="11" width="26" height="11" rx="5.5" fill="#e9b35f"/><rect x="2" y="13.5" width="28" height="6" rx="3" fill="#c4452f"/><path d="M6 16.5q3-2 6 0t6 0t6 0" stroke="#ffd23f" stroke-width="1.6" fill="none"/>'},
 sandwich:{n:'Sandwich',h:20,svg:'<path d="M4 24L16 6L28 24Z" fill="#f1d9a6"/><path d="M6 21.5H26" stroke="#6fbf4a" stroke-width="3"/><path d="M4 24H28" stroke="#d99a5b" stroke-width="2.5"/>'},
 melon:{n:'Watermelon',h:30,svg:'<path d="M3 12A13 13 0 0 0 29 12Z" fill="#3f9b47"/><path d="M5.5 12A10.5 10.5 0 0 0 26.5 12Z" fill="#ff5a6e"/><circle cx="12" cy="16" r="1.2" fill="#222"/><circle cx="17" cy="18" r="1.2" fill="#222"/><circle cx="21" cy="15" r="1.2" fill="#222"/>'},
 mallow:{n:'Marshmallows',h:12,svg:'<rect x="7" y="6" width="18" height="22" rx="3" fill="#7fc9ff"/><rect x="7" y="4" width="18" height="4" fill="#4a90c9"/><rect x="11" y="13" width="5" height="5" rx="1.5" fill="#fff"/><rect x="16" y="18" width="5" height="5" rx="1.5" fill="#fff"/>'},
 apple:{n:'Apple',h:10,svg:'<circle cx="12" cy="18" r="8" fill="#e23b3b"/><circle cx="20" cy="18" r="8" fill="#e23b3b"/><path d="M16 11Q16 6 19 4" stroke="#6b3d1f" stroke-width="2" fill="none"/><ellipse cx="21" cy="8" rx="4" ry="2" fill="#5cb347"/>'},
 pie:{n:'Berry pie',h:35,svg:'<ellipse cx="16" cy="19" rx="13" ry="8" fill="#c98a4b"/><ellipse cx="16" cy="17" rx="11" ry="6" fill="#7a2f6b"/><path d="M7 17h18M10 13l12 8M22 13l-12 8" stroke="#e9b35f" stroke-width="1.8"/>'},
 soda:{n:'Pop can',h:6,svg:'<rect x="10" y="5" width="12" height="22" rx="3" fill="#2f7de1"/><rect x="10" y="12" width="12" height="7" fill="#fff"/><rect x="12" y="4" width="8" height="2" rx="1" fill="#bbb"/>'},
 fish:{n:'Smoked fish',h:28,svg:'<ellipse cx="14" cy="16" rx="10" ry="6" fill="#c9773a"/><path d="M23 16L30 10V22Z" fill="#a85f2b"/><circle cx="9" cy="14.5" r="1.4" fill="#222"/>'},
 chips:{n:'Chips',h:10,svg:'<path d="M8 5H24L26 27H6Z" fill="#ffc83d"/><rect x="11" y="12" width="10" height="8" rx="4" fill="#e2463a"/>'},
 pancakes:{n:'Pancake stack',h:30,svg:'<ellipse cx="16" cy="25" rx="14" ry="4" fill="#e6e1d6"/><rect x="5" y="16" width="22" height="6" rx="3" fill="#e9b86b"/><rect x="5" y="11" width="22" height="6" rx="3" fill="#d9a35a"/><rect x="5" y="6" width="22" height="6" rx="3" fill="#e9b86b"/><rect x="13" y="3" width="6" height="4" rx="1" fill="#fff1a8"/><path d="M8 9q4 7 8 2t8 5" stroke="#8a3f12" stroke-width="2" fill="none"/>'},
 burger:{n:'Logger burger',h:34,svg:'<path d="M5 14a11 9 0 0 1 22 0Z" fill="#e2a65a"/><rect x="4" y="14" width="24" height="3" fill="#6fcf4a"/><rect x="4" y="16.5" width="24" height="2" fill="#ffcc33"/><rect x="4" y="18" width="24" height="4" rx="2" fill="#6b3a1f"/><rect x="5" y="22" width="22" height="5" rx="2.5" fill="#e2a65a"/>'}
};
const icon=k=>`<svg viewBox="0 0 32 32">${FOOD[k].svg}</svg>`;
const LOOT={cooler:['hotdog','sandwich','soda','melon','fish','hotdog'],basket:['sandwich','apple','pie','chips','mallow','apple'],bin:['apple','chips','soda']};
const OUTFITS={

let AC=null;
function sfx(f,d=.1,type='square',v=.08,slide=0){if(!SET.vol)return;v*=SET.vol/70;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

function talk(lines,done){let i=0;const show=()=>{const [who,txt]=lines[i];openModal(`${who?`<p><span class="who">${esc(who)}</span></p>`:''}<p>${esc(txt)}</p><div class="btns"><button class="btn" data-a="next">${i<lines.length-1?'Next':'OK'}</button></div>`);

const hour=()=>S.time/60;

function observersSeeing(){return npcs.filter(o=>sees(o))}
function caughtStealing(){const w=observersSeeing();w.forEach(o=>{if(disg()&&o.kind!=='guard'){o.n=Math.max(o.n,.75);say(o,'Hey! Not yours!')}else o.n=1});return w.length}
function noise(r){npcs.forEach(o=>{if(!o.asleep&&!o.still&&dist(o.x,o.y,P.x,P.y)<r&&o.state!=='flee'){o.ang=Math.atan2(P.y-o.y,P.x-o.x);if(o.kind==='camper'||o.kind==='towny'||o.kind==='walker'){o.state='look';o.t=1.5}}})}
function take(o){if(S.inv.length>=6&&o.k!=='bin'){toast('Backpack full! Eat (Q) or stash at the den.');return}
  if(o.k==='bin'){noise(150);caughtStealing();sfx(180,.18,'sawtooth',.06,-60);if(!o.stock){toast('Just old newspapers.');return}o.stock=0;if(rnd()<.55||S.q===4&&S.coins<5||S.inv.length>=6){const c=2+Math.floor(rnd()*3);S.coins+=c;toast(`Found ${c} coins in the trash!`);sfx(1200,.08,'square',.06)}else{const k=pick(LOOT.bin);S.inv.push(k);toast('Found '+FOOD[k].n+' (slightly used)')}renderSlots();return}
  if(!o.stock.length){toast(`This ${o.k} is empty. It restocks overnight.`);return}
  const k=o.stock.shift();S.inv.push(k);S.stats.raids++;caughtStealing();sfx(520,.08,'square',.07,200);toast(`Snagged ${FOOD[k].n}!`);renderSlots()}
function consume(k){S.hunger=Math.min(100,S.hunger+FOOD[k].h);S.stats.eaten++;sfx(300,.07,'square',.07,-80);setTimeout(()=>sfx(240,.08,'square',.07,-80),90);toast(`Ate ${FOOD[k].n} (+${FOOD[k].h})`);if(S.q===1)advance(2)}
function eat(i){const k=S.inv[i];if(!k)return;S.inv.splice(i,1);renderSlots();consume(k)}
function wear(k,quiet){const w=observersSeeing();S.outfit=k;if(k!=='none')S.pick=k;sfx(k!=='none'?440:330,.12,'triangle',.1);if(!quiet)toast(k==='none'?'Outfit off. Full fur.':OUTFITS[k].n+' on. '+OUTFITS[k].perk);if(w.length&&!quiet){w.forEach(o=>o.n=Math.max(o.n,.9));toast('Someone saw you change!')}}
function toggleCoat(){if(!S.owned.length){toast('You need a disguise first.');return}wear(disg()?'none':(has(S.pick)?S.pick:S.owned[0]))}
function scared(o){o.n=1;say(o,o.kind==='towny'?'EEK! It\'s a BIGFOOT!':'AAAH!')}
function interact(){const o=nearInt();if(!o)return;
  if(o.k==='dismount'){dismount();return}
  if(o.k==='dive'){startDive(o.i);return}
  if(o.k==='office'){searchOffice();return}
  if(o.k==='secret'){islandSecret();return}
  if(o.k==='lodge'){if(hour()<7||hour()>=19){toast('The lodge is closed. Open 7 AM to 7 PM.');return}if(!disg()){toast('Ingrid shrieks and drops a tray of cocoa!');report();return}lodgeUI();return}
  if(o.k==='lift'){if(hour()<7||hour()>=19){toast('The chairlift runs 7 AM to 7 PM.');return}if(!disg()){toast('Olaf the liftie yells "YETI!" and hits the emergency stop.');report();return}if(S.skiDay!==S.day){toast('You need skis. Rent them at the Ski Lodge.');return}startSki('race');return}
  if(o.veh){mount(o.veh);return}
  if(o.k==='table'){if(!o.stock.length){toast('Just crumbs. Tables get new food each morning.');return}caughtStealing();feastUI('table',o);return}
  if(o.k==='tackle'){S.side.truck=2;sfx(700,.12,'triangle',.1);toast('Got Walt\'s tackle box. Smells like worms. Bring it to Walt.');save();return}
  if(o.k==='album'){deskUI();return}
  if(o===dog){dogInteract();return}
  if(o.k==='mush'){const m=o.m;if(S.basket.length>=12){toast('Your basket is full. Sell to Dot at the diner.');return}mush.splice(mush.indexOf(m),1);S.basket.push(m.k);sfx(660,.06,'triangle',.08);if(!S.guide[m.k]){S.guide[m.k]=1;toast(`New guidebook entry: ${MUSH[m.k].n}!${MUSH[m.k].poison?' Uh-oh, it\'s poisonous.':''}`)}else toast(`Picked a ${MUSH[m.k].n}.`);return}
  if(o.k==='truffle'){o.t.found=true;S.truffles++;S.guide.truffle=1;dog.wag=3;sfx(990,.1,'triangle',.1);setTimeout(()=>sfx(1320,.12,'triangle',.1),100);toast('You dug up a truffle! Dot pays 25 coins for these.');save();return}
  if(o.k==='fish'){startFishing();return}
  if(o.k==='grill'){cookFish();return}
  if(o.k==='keys'||o.k==='lunch'){sabotage(o.k);return}
  if(o.k==='bait'){if(hour()<6||hour()>=20){toast('Bait & Tackle is closed. Open 6 AM to 8 PM.');return}if(!disg()){toast('Marge drops a bucket of worms and screams!');report();return}baitUI();return}
  if(o.k==='golf'){if(hour()<7||hour()>=20){toast('Golf club closed. Open 7 AM to 8 PM.');return}if(!disg()){toast('The pro shop guy screams and dives behind the counter!');report();return}golfUI();return}
  if(o===pip){pipTalk();return}
  if(o.talk||o===gus){if(!disg()){scared(o);return}townTalk(o);return}
  if(o.k==='cooler'||o.k==='basket'||o.k==='bin'){take(o);return}
  if(o.k==='fridge'){fridgeUI();return}
  if(o.k==='wardrobe'){wardrobeUI();return}
  if(o.k==='bed'){const h=hour();if(h>=18||h<5)sleep();else toast('Not sleepy yet. Beds open after 6 PM.');return}
  if(o.k==='coat'){S.owned.push('coat');wear('coat',true);caughtStealing();sfx(700,.15,'triangle',.12);toast('Got a raincoat and bucket hat! Press G to swap.');if(S.q===3)advance(4);return}
  if(o.k==='shop'){if(!disg()){clerk.n=1;say(clerk,'EEEK! A BIGFOOT!');return}shopUI();return}
  if(o.k==='board'){if(S.q>=5)notice();else toast('Lost dog posters and a fishing derby flyer.');return}
  if(o.k==='diner'||o.k==='store'||o.k==='po'){if(!townOpen()){toast('Closed. Open 7 AM to 9 PM.');return}if(!disg()){const t={diner:dot,store:walt,po:iris}[o.k];t.n=1;say(t,'BIGFOOT AT THE DOOR!');return}({diner:dinerUI,store:storeUI,po:poUI})[o.k]();return}}
function pipTalk(){const L={0:[['Pip the crow','Moss! Wake up, big guy. The campers are back at Hollowpine and their coolers are FULL.'],['Pip the crow','Sneak in, grab a snack, and eat it. Stay out of their sight cones, and duck into bushes if someone looks your way.'],['Pip the crow','And watch out for Ranger Hollis. Get caught and you\'ll drop everything you\'re carrying.']],
  1:[['Pip the crow','Coolers, baskets and picnic tables are at every campsite. Walk up and press E. To eat, press Q (or tap a snack) and drag the food into your big mouth.']],
  2:[['Pip the crow','Winter\'s coming. Fill that fridge in your den. Five snacks, minimum.']],
  3:[['Pip the crow','Humans trust anyone in a raincoat. There\'s one on the Lakeview clothesline, south side of camp.']],
  4:[['Pip the crow','With that coat on, campers will ignore you. Rangers still squint, so don\'t dawdle. Bev at the Snack Shack takes coins; people toss them in the trash bins, weirdly.']],
  5:[['Pip the crow','Something\'s off. A man in a shiny suit pinned a notice by the Ranger Station. Go read it.']],
  6:[['Pip the crow','Grube\'s the one buying the campground. He\'s always in Pinewick. Follow the road east, and keep that disguise on. Deputy Ruiz walks Main Street.']],
  7:[['Pip the crow','Humans with jobs hear everything. Dot at the Stack \'Em Diner is short a cook. Go in the front door, disguised.']],
  8:[['Pip the crow','Grube eats lunch on the diner patio, 11 to 2. That bush behind the patio is perfect for snooping. Sneak in from behind the buildings.']],
  9:[['Pip the crow','A rare species, Moss. That\'s you. We need PROOF, but the kind that doesn\'t end with you in a zoo. Iris sells disposable cameras at the post office.']],
  10:[['Pip the crow','Evidence hunt! Your giant footprints on the east lakeshore, your old mossy nest in the woods between here and the lake, and that tuft of your fur stuck on the Elk Ridge fence.'],['Pip the crow','Press C to aim, E to snap. Centre it, from a few steps away. And don\'t let anyone see you taking them.'],['Pip the crow','Bad news: Grube hired a private eye, Hank Voss. He prowls the campground at dusk with a camera. If he photographs you without a disguise, Grube rushes the vote.']],
  11:[['Pip the crow','Dr. Anita Holm, the provincial biologist, visits the Ranger Station from 9 to 5. Bring her the album from your den. Disguised!']],
  12:[['Pip the crow','Bad news, Moss. Grube hired a bulldozer crew. They\'re clearing the woods east of your den while the review drags on.'],['Pip the crow','They work by day. At night a watchman named Stu patrols with a flashlight. Hide the bulldozer keys AND swap their lunch in one night, and they lose a whole day.'],['Pip the crow','Also: a stray dog named Biscuit hangs around the south end of the campground. Feed her for three days and she\'s yours.']],
  13:[['Pip the crow','Moss! I heard Kendra on the patio: Grube is trying to buy off Dr. Holm! He keeps his papers in the site office trailer at the bulldozer site.'],['Pip the crow','Sneak in at night, after 8, and find proof. Mind Stu and his flashlight.'],['Pip the crow','Oh, and the mountain north of the golf course is open for skiing, Marge rents canoes now, and there\'s an island in the lake nobody visits. Just saying.']],
  14:[['Pip the crow','He wrote it DOWN. Take that letter to Iris at the post office. She\'ll get it to the Pinewick Gazette.']],
  15:[['Pip the crow','Read the paper tomorrow, Moss. The whole town is going to know what Grube did.']]}[S.q];
  talk(L,()=>{if(S.q===0)advance(1)})}

  <div class="grid">${S.fridge.map((k,i)=>`<div class="slot" data-a="f${i}" title="${esc(FOOD[k].n)}">${icon(k)}</div>`).join('')||'<p style="grid-column:1/-1;color:var(--dim)">Empty. Sad.</p>'}</div>
  <p style="margin-top:12px">Backpack: ${S.inv.length}/6</p><div class="grid">${S.inv.map(k=>`<div class="slot">${icon(k)}</div>`).join('')}</div>
  <div class="btns"><button class="btn" data-a="stash" ${S.inv.length?'':'disabled'}>Stash all</button><button class="btn alt" data-a="close">Close</button></div>`,a=>{
    if(a==='stash'){S.fridge.push(...S.inv);S.inv=[];sfx(500,.1,'triangle',.1);renderSlots();if(S.fridge.length>=5&&S.q===2)advance(3);save();draw()}

function shopUI(){const items=[{k:'hotdog',p:5},{k:'pie',p:8},{k:'mallow',p:3}];const draw=()=>menu(`<h2 class="slab">Snack Shack</h2><p><span class="who">Bev:</span> "Afternoon, hon. Love the look." You have <b>${S.coins}</b> coins.</p>

  <div class="btns"><button class="btn alt" data-a="close">Leave</button></div>`,a=>{const s=items[+a.slice(1)];if(S.coins>=s.p&&S.inv.length<6){S.coins-=s.p;S.inv.push(s.k);sfx(990,.08,'square',.07);setTimeout(()=>sfx(1320,.1,'square',.07),80);renderSlots();if(S.q===4)advance(5);draw()}});draw()}
function storeUI(){const food=[{k:'apple',p:2},{k:'chips',p:3},{k:'fish',p:6}],outs=[{k:'sweater',p:12},{k:'vest',p:20}];const draw=()=>menu(`<h2 class="slab">Brambles General Store</h2><p><span class="who">Walt:</span> "Sweaters, vests, jerky, opinions. What'll it be?" You have <b>${S.coins}</b> coins.</p>
  <div class="row"><svg viewBox="0 0 32 32"><path d="M4 28L26 4" stroke="#8a5d36" stroke-width="2.5"/><path d="M26 4Q30 14 24 22" stroke="#fbf3df" stroke-width="1" fill="none"/><circle cx="9" cy="23" r="3" fill="#3b2614"/></svg><div><b>Fishing rod</b><br><small>Cast from the lakeshore or the dock. Sell your catch at the Bait &amp; Tackle.</small></div>${S.rod?'<button class="btn alt" disabled>Owned</button>':`<button class="btn" data-a="rod" ${S.coins>=12?'':'disabled'}>12 coins</button>`}</div>
  <div class="row">${BIKESVG}<div><b>Bicycle</b><br><small>Much faster than walking. Noisy if you ride undisguised.</small></div>${S.veh.bike?'<button class="btn alt" disabled>Owned</button>':`<button class="btn" data-a="bike" ${S.coins>=15?'':'disabled'}>15 coins</button>`}</div>
  ${outs.map(o=>`<div class="row">${oicon(o.k)}<div><b>${OUTFITS[o.k].n}</b><br><small>${OUTFITS[o.k].perk}</small></div>${has(o.k)?'<button class="btn alt" disabled>Owned</button>':`<button class="btn" data-a="o${o.k}" ${S.coins>=o.p?'':'disabled'}>${o.p} coins</button>`}</div>`).join('')}
  ${food.map((s,i)=>`<div class="row">${icon(s.k)}<div><b>${FOOD[s.k].n}</b><br><small>+${FOOD[s.k].h} hunger</small></div><button class="btn" data-a="b${i}" ${S.coins>=s.p&&S.inv.length<6?'':'disabled'}>${s.p} coins</button></div>`).join('')}
  <div class="btns"><button class="btn alt" data-a="close">Leave</button></div>`,a=>{
    if(a==='rod'){if(S.coins>=12&&!S.rod){S.coins-=12;S.rod=true;sfx(990,.1,'triangle',.1);toast('Got a fishing rod! Face the lake and press E to fish.');save()}draw();return}
    if(a==='bike'){if(S.coins>=15&&!S.veh.bike){S.coins-=15;S.veh.bike={x:3200,y:745,a:0};sfx(990,.1,'triangle',.1);toast('Bought a bike! It\'s parked outside. Press E next to it to ride.');save()}draw();return}
    if(a[0]==='o'){const o=outs.find(x=>x.k===a.slice(1));if(S.coins>=o.p&&!has(o.k)){S.coins-=o.p;S.owned.push(o.k);wear(o.k,true);sfx(990,.1,'triangle',.1);toast(`Bought the ${OUTFITS[o.k].n} and put it on! Swap outfits at your den wardrobe.`);save()}}
    else{const s=food[+a.slice(1)];if(S.coins>=s.p&&S.inv.length<6){S.coins-=s.p;S.inv.push(s.k);sfx(990,.08,'square',.07);renderSlots()}}draw()});draw()}
function dinerUI(){const worked=S.shiftDay===S.day,items=[{k:'pancakes',p:6},{k:'burger',p:7}];const draw=()=>menu(`<h2 class="slab">Stack 'Em Diner</h2><p><span class="who">Dot:</span> "${worked?'You already worked today, hon. Grill\'s yours again tomorrow.':'Kitchen\'s hoppin\'! Want a shift on the grill? Sixty seconds of pure chaos.'}"</p>
  <div class="row"><svg viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="24" rx="2" fill="#fbf3df"/><path d="M10 11h12M10 16h12M10 21h8" stroke="#3b2614" stroke-width="2"/></svg><div><b>Line cook shift</b><br><small>Build orders from the tickets, in order, before they expire. Once per day.${S.stats.best?` Best: ${S.stats.best} coins.`:''}</small></div><button class="btn" data-a="shift" ${worked?'disabled':''}>Work</button></div>

  <div class="row"><svg viewBox="0 0 32 32"><circle cx="16" cy="18" r="10" fill="#3b2a1e"/><circle cx="12" cy="15" r="2" fill="#5a4030"/></svg><div><b>Sell truffles</b><br><small>25 coins each, for Dot's famous truffle fries. You have ${S.truffles}.</small></div><button class="btn" data-a="truf" ${S.truffles?'':'disabled'}>Sell</button></div>
  <div class="btns"><button class="btn alt" data-a="close">Leave</button></div>`,a=>{if(a==='shift'){startShift();return}if(a==='mush'){sellMush();if(!$('#modal').hidden&&!$('[data-a=next]'))draw();return}if(a==='truf'){const c=S.truffles*25;S.coins+=c;S.truffles=0;sfx(1200,.1,'square',.07);toast(`Sold truffles for ${c} coins!`);save();draw();return}const s=items[+a.slice(1)];if(S.coins>=s.p&&S.inv.length<6){S.coins-=s.p;S.inv.push(s.k);sfx(990,.08,'square',.07);renderSlots();draw()}});draw()}
function townTalk(o){
  if(o===dot)talk(S.q<=7?[['Dot Pickering','Well butter my biscuits, a new face! You\'ve got the shoulders of a fry cook.'],['Dot Pickering','I\'m short a line cook. Come in the front door when you want a shift. Pays in coins and gossip.']]:S.q===8?[['Dot Pickering','That Grube fella eats on my patio every day, 11 to 2. Tips like a rock. Talks like a foghorn.']]:[['Dot Pickering','Thirty days till the council vote. If they pave Hollowpine, who\'s going to eat my pancakes? Campers, that\'s who. Nobody else.']]);
  else if(o===walt){const tk=S.side.truck;
    if(tk===0)talk([['Walt Brambles','Welcome to Brambles. Fourth generation. Sweaters keep you quiet, vests keep you official. Don\'t ask how I know.'],['Walt Brambles','Say, you look like you can carry things. Two summers ago I left my lucky tackle box on the east shore of the lake by the campground.'],['Walt Brambles','Bring it back and you can have my old pickup out back. Runs on hope and duct tape.']],()=>{S.side.truck=1;toast('Side quest: Truck Trouble');sfx(660,.12,'triangle',.12);save()});
    else if(tk===1)talk([['Walt Brambles','East shore of the lake, past the campground. Green box. Smells like worms.']]);
    else if(tk===2)talk([['Walt Brambles','My tackle box! My lucky lure! Here, take the keys. She\'s parked in the lot. Pump the gas twice and don\'t mind the smell.']],()=>{S.side.truck=3;S.veh.truck={x:2700,y:1040,a:0};toast('You got Walt\'s pickup! It\'s in the parking lot.');save()});
    else talk([['Walt Brambles','How\'s the old girl running? Trucks are loud. Folks notice a big hairy driver, so wear something.'],...(S.q>=9?[['Walt Brambles','Grube wants to put a parkade where my granddad fished. Over my dead jerky.']]:[])])}
  else if(o===iris){const p=S.side.parcel;
    if(p===0)talk([['Iris Okafor','Oh, thank goodness. You look sturdy. A parcel came for a camper named Gus out at the Big Stump campsite.'],['Iris Okafor','My mail truck\'s in the shop. Could you run it out there? There\'s coin in it for you.']],()=>{S.side.parcel=1;toast('Side quest: Special Delivery');sfx(660,.12,'triangle',.12);save()});
    else if(p===1)talk([['Iris Okafor','Big Stump campsite, east side of Hollowpine. Gus has a grey beard and a green shirt.']]);
    else if(p===2)talk([['Iris Okafor','Delivered? You\'re a lifesaver. Here\'s 15 coins.'],['Iris Okafor','And between us… Grube has been mailing a LOT of letters to the town council lately.']],()=>{S.side.parcel=3;S.coins+=15;sfx(1200,.1,'square',.07);toast('+15 coins. Special Delivery complete!');save()});
    else talk([['Iris Okafor','Nothing for you today, hon. Unless you\'re expecting something from a "G. Grube"? No? Good.']])}
  else if(o===holm){
    if(S.q<10)talk([['Dr. Anita Holm','Provincial biologist, doing a field survey. Lovely forest. Nothing unusual so far, sadly.']]);
    else if(S.q===10)talk([['Dr. Anita Holm',`Signs of something unusual in Hollowpine? Bring me clear photos: footprints, nests, hair. You have ${evCount()} of 3 so far.`]]);
    else if(S.q===11){const avg=Math.round((S.ev.prints+S.ev.nest+S.ev.tuft)/3);talk([['Dr. Anita Holm','You have photographs? Let me see that album…'],['Dr. Anita Holm',avg>=80?'Crisp, well framed, perfect scale. Whoever took these could work for a nature magazine.':avg>=60?'A little shaky, but the detail is all there.':'Blurry… but even blurry, these footprints are forty centimetres long.'],['Dr. Anita Holm','A large bipedal primate, living in Hollowpine. This is extraordinary. I\'m filing an emergency species review today.'],['Dr. Anita Holm','The council can\'t approve the resort until the review is finished. Your photos just bought this valley some time.'],['','Meanwhile, on the diner patio…'],['Gideon Grube','A SPECIES REVIEW?! Kendra, tell Voss to double his hours. I want that "monster" photographed in a cheap costume before the vote!']],()=>{advance(12);save();endCard3()})}
    else talk([['Dr. Anita Holm','The review is underway. Keep your head down, and watch out for that Voss character with the camera.']])}
  else if(o===gus)talk([['Gus','A parcel? From my sister! Oatmeal cookies!'],['Gus','Thanks, uh… very tall mail person. Tell Iris I said hi.']],()=>{S.side.parcel=2;toast('Parcel delivered. Return to Iris.');save()})}
function notice(){talk([['Notice board','NOTICE: Hollowpine Provincial Campground has been purchased by GRUBE HOLDINGS INC.'],['Notice board','Coming soon: the GRUBE GRAND RESORT, featuring 400 condos, a wave pool and a 6-level parkade. Pending town council approval. — Gideon Grube, CEO'],['Moss','…'],['Pip the crow','Six levels of PARKADE? Where are the coolers going to go, Moss? We need to find out more about this Grube guy. He\'s always in town.']],()=>{if(S.q===5)advance(6)})}
function overhear(){talk([['Gideon Grube','The council votes on my resort permit in thirty days, Kendra. Thirty days, and Hollowpine is a parkade.'],['Kendra','The environmental review could be a problem, sir. If anyone documents a rare species out there, the province can protect the whole valley.'],['Gideon Grube','Rare species? It\'s squirrels and campers. Unless Bigfoot shows up with a lawyer, we\'re golden. Ha!'],['Moss','…'],['Pip the crow','Moss. MOSS. You ARE the rare species.']],()=>{S.deadline=S.day+30;advance(9);toast('Council vote in 30 days!');S.done=true;save();endCard()})}
function endCard(){openModal(`<h2 class="slab">To be continued…</h2><p>You finished Pinecone Prowler Slice 2: the Town and the first job.</p><p>Day ${S.day} · ${S.stats.raids} raids · ${S.stats.shifts} diner shift${S.stats.shifts===1?'':'s'} · ${S.stats.eaten} snacks eaten · caught ${S.stats.caught} time${S.stats.caught===1?'':'s'}.</p><p style="color:var(--dim)">Keep exploring: cook more shifts, buy outfits, finish Iris's delivery.</p><div class="btns"><button class="btn" data-a="go">Keep playing</button></div>`);$('#card').onclick=e=>{if(e.target.closest('[data-a=go]'))closeModal()}}
function sleep(){S.day++;S.time=7*60;S.hunger=Math.max(0,S.hunger-15);flash=1;restock();resetNPCs();save();toast(`Day ${S.day}. Coolers are restocked.`)}
