<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Fernhollow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed pixel canvas; HUD pinned to the corners; one sheet open at a time. Single dark look by choice. */
:root{
  --ink:#141d2b; --panel:#1e2c3f; --panel-2:#293c54; --line:#40607c;
  --text:#eaf2e6; --muted:#a3b8b0; --gold:#f2b63d; --leaf:#86d46c; --rose:#f07a93; --water:#62b8ea;
  --display:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#game{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{position:absolute;inset:0;padding-block:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card{background:rgba(30,44,63,.93);border:2px solid var(--line);border-radius:4px;box-shadow:0 3px 0 rgba(10,15,24,.6);pointer-events:auto}
#clock{padding:6px 10px;font-family:var(--display);min-width:0}
#clock .d{font-size:15px;color:var(--muted);letter-spacing:.02em}
#clock .t{font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
#clock .g{font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
#side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
#energy,#health{padding:5px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--display);font-size:14px}
#ebar,#hbar{width:96px;height:10px;background:var(--ink);border:1px solid var(--line)}
#efill{height:100%;background:var(--leaf);width:100%}
#hfill{height:100%;background:var(--rose);width:100%}
#menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#menu button{background:rgba(30,44,63,.93);border:2px solid var(--line);border-radius:4px;padding:4px 9px;font-family:var(--display);font-size:15px;pointer-events:auto}
#menu button:hover{border-color:var(--gold)}
#toast{align-self:center;background:rgba(20,29,43,.92);border:2px solid var(--gold);border-radius:4px;padding:5px 12px;font-family:var(--display);font-size:16px;text-align:center;max-width:100%;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
.grow{flex:1;min-height:0}
#dialog{align-self:center;width:min(100%,620px);padding:10px 14px 12px;cursor:pointer}
#dwho{font-family:var(--display);font-size:18px;color:var(--gold)}
#dtxt{font-size:16px;min-height:2.9em;text-wrap:pretty}
#dch{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#dmore{font-family:var(--display);font-size:13px;color:var(--muted);text-align:right}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:4px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:17px;box-shadow:0 3px 0 #a9761b}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a9761b}
.btn.alt{background:var(--panel-2);color:var(--text);box-shadow:0 3px 0 var(--ink);border:2px solid var(--line);padding:5px 12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.sm{font-size:14px;padding:3px 9px}
#fish{align-self:center;width:min(100%,360px);padding:10px 12px}
#fish .lab{font-family:var(--display);font-size:16px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
#fbar{position:relative;height:22px;background:var(--ink);border:2px solid var(--line)}
#fzone{position:absolute;top:0;bottom:0;background:var(--leaf);opacity:.75}
#fmark{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--text)}
#touch{display:none;justify-content:space-between;align-items:flex-end}
@media (pointer:coarse){#touch{display:flex}}
#joy{width:112px;height:112px;border-radius:50%;background:rgba(30,44,63,.55);border:2px solid var(--line);position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(234,242,230,.75)}
#actbtn{width:84px;height:84px;border-radius:50%;background:rgba(242,182,61,.85);color:var(--ink);border:3px solid #a9761b;font-family:var(--display);font-weight:700;font-size:20px;pointer-events:auto;touch-action:none}
#hotbar{display:grid;grid-template-columns:repeat(10,minmax(0,46px));gap:4px;justify-content:center}
.slot{position:relative;aspect-ratio:1;background:rgba(30,44,63,.93);border:2px solid var(--line);border-radius:4px;padding:2px;pointer-events:auto;min-width:0}
.slot img{width:100%;height:100%;image-rendering:pixelated;display:block}
.slot .n{position:absolute;right:1px;bottom:-1px;font-family:var(--display);font-size:12px;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);font-variant-numeric:tabular-nums}
.slot .k{position:absolute;left:2px;top:-2px;font-family:var(--display);font-size:10px;color:var(--muted)}
.slot.sel{border-color:var(--gold);background:var(--panel-2);box-shadow:0 0 0 2px rgba(242,182,61,.35)}
#sheet{position:absolute;inset:0;background:rgba(14,20,31,.72);display:grid;place-items:center;padding-block:14px}
#panel{width:min(100%,660px);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#phead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:2px solid var(--line);flex-wrap:wrap}
#phead h2{font-family:var(--display);font-size:22px;margin:0;margin-right:auto;font-weight:600}
#pbody{padding:12px;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:14px}
#pbody h3{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(64,96,124,.5)}
.row:last-child{border-bottom:0}
.row img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{font-family:var(--display);font-size:17px;font-weight:600;display:block}
.row .nm span{color:var(--muted);font-size:13px;display:block}
.row .pr{font-family:var(--display);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .bs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.hearts{font-size:15px;letter-spacing:1px;color:var(--rose);white-space:nowrap}
.hearts i{font-style:normal;color:var(--line)}
.goal{display:flex;gap:8px;align-items:baseline}
.goal .bx{font-family:var(--display);color:var(--leaf);width:1.2em;flex:none}
.goal.done{color:var(--muted);text-decoration:line-through}
.info{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.info p{margin:0;flex:1;min-width:160px}
kbd{font-family:var(--display);background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:14px}
dl.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
dl.keys dd{margin:0;color:var(--muted)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-block:28px;background:linear-gradient(100deg,rgba(14,20,31,.9) 0%,rgba(14,20,31,.62) 45%,rgba(14,20,31,.1) 100%)}
#title h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,11vw,104px);line-height:.9;margin:0;color:var(--text);text-shadow:4px 4px 0 #2f7f86,8px 8px 0 rgba(10,15,24,.7)}
#title p{max-width:44ch;font-size:17px;margin:14px 0 18px;color:var(--text)}
#title .acts{display:flex;gap:10px;flex-wrap:wrap}
#title small{display:block;margin-top:16px;color:var(--muted);font-size:13px}
@media (max-width:520px){#clock .t{font-size:18px}#menu button{padding:3px 6px;font-size:13px}#ebar,#hbar{width:64px}.slot .k{display:none}#hotbar{gap:3px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud" class="gut" hidden>
    <div id="top">
      <div id="clock" class="card"><div class="d" id="hdate"></div><div class="t" id="htime"></div><div class="g" id="hgold"></div></div>
      <div id="side">
        <div id="energy" class="card"><span>Energy</span><div id="ebar"><div id="efill"></div></div></div>
        <div id="health" class="card" hidden><span>Health</span><div id="hbar"><div id="hfill"></div></div></div>
        <div id="menu">
          <button id="mbag" type="button">Bag</button>
          <button id="mjournal" type="button">Journal</button>
          <button id="mhelp" type="button">Help</button>
          <button id="msound" type="button">Sound on</button>
        </div>
      </div>
    </div>
    <div id="toast" role="status"></div>
    <div class="grow"></div>
    <div id="fish" class="card" hidden>
      <div class="lab"><span id="flab">Reel it in</span><span id="fhits"></span></div>
      <div id="fbar"><div id="fzone"></div><div id="fmark"></div></div>
    </div>
    <div id="dialog" class="card" hidden>
      <div id="dwho"></div><div id="dtxt"></div><div id="dch"></div><div id="dmore">Space or tap to continue</div>
    </div>
    <div id="touch"><div id="joy"><div id="knob"></div></div><button id="actbtn" type="button">Use</button></div>
    <div id="hotbar"></div>
  </div>
  <div id="sheet" class="gut" hidden>
    <div id="panel" class="card">
      <div id="phead"><h2 id="ptitle"></h2><span id="ptabs"></span><button class="btn alt sm" id="pclose" type="button">Close</button></div>
      <div id="pbody"></div>
    </div>
  </div>
  <div id="title" class="gut">
    <h1>Fernhollow</h1>
    <p>Your aunt left you a weedy field, six tools and a village on the far side of the stream. Grow something.</p>
    <div class="acts">
      <button class="btn" id="bcontinue" type="button" hidden>Continue farm</button>
      <button class="btn" id="bnew" type="button">New farm</button>
    </div>
    <small>Move with WASD or arrows. Space uses what you hold. Your farm saves in this browser each night.</small>
  </div>
</div>

 if(lanT>0)for(let k=0;k<22;k++){const x=(42+hash(k,3,90)*16)*T+Math.sin(animT*.8+k)*9-cx,y=13*T-((k*31+(40-lanT)*15)%260)-cy;R(ctx,'#f6b23c',Math.round(x)-1,Math.round(y)-2,3,4);R(ctx,'#fff3b0',Math.round(x),Math.round(y)-1,1,2)}
 if(S.weather==='rain')for(let k=0;k<110;k++){const x=((hash(k,1,1)*vw-animT*50)%vw+vw)%vw,y=(hash(k,2,1)*vh+animT*(250+hash(k,3,1)*90))%vh;R(ctx,'rgba(200,225,255,.5)',Math.floor(x),Math.floor(y),1,4)}
 else if(S.weather==='snow')for(let k=0;k<90;k++){const x=((hash(k,1,2)*vw+Math.sin(animT+k)*6)%vw+vw)%vw,y=(hash(k,2,2)*vh+animT*(18+hash(k,3,2)*16))%vh;R(ctx,'rgba(255,255,255,.85)',Math.floor(x),Math.floor(y),k%3?1:2,k%3?1:2)}
 else if(se===0||se===2)for(let k=0;k<16;k++){const x=((hash(k,1,4)*vw+animT*14+Math.sin(animT+k)*8)%vw+vw)%vw,y=(hash(k,2,4)*vh+animT*(10+hash(k,3,4)*10))%vh;R(ctx,se===0?'rgba(246,193,211,.8)':'rgba(217,119,46,.8)',Math.floor(x),Math.floor(y),2,1)}
 else if(se===1&&dk>.4)for(let k=0;k<14;k++)if(Math.sin(animT*2+k*1.7)>.3)R(ctx,'#f6f08a',Math.floor((hash(k,1,6)*vw+Math.sin(animT*.5+k)*12+vw)%vw),Math.floor((hash(k,2,6)*vh+Math.cos(animT*.4+k)*10+vh)%vh),1,1);
}
function resize(){const g=$('#game'),w=g.clientWidth||innerWidth,h=g.clientHeight||innerHeight,sc=clamp(Math.round(Math.min(w/352,h/208)),2,6);cv.width=Math.ceil(w/sc);cv.height=Math.ceil(h/sc);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);
let last=0;function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}

/* ---------- boot ---------- */
function begin(){ui='play';$('#title').hidden=true;$('#hud').hidden=false;lastHud='';renderHud();renderHot()}
function start(hot){const saved=hot&&hot.S?hot:loadSave();resize();
 if(hot&&hot.S){restore(hot);begin()}else{newGame();P.x=13*T;P.y=13*T;if(saved)$('#bcontinue').hidden=false}
 let armed=false;
 $('#bcontinue').onclick=()=>{initAudio();restore(saved);begin()};
 $('#bnew').onclick=()=>{if(saved&&!armed){armed=true;$('#bnew').textContent='Replace the saved farm?';return}initAudio();newGame();begin();
  say('A note on the door',['"The deed is yours now. The field has gone to weeds, but the soil underneath is good.','Hoe a patch, plant the radish seeds, water them every morning. Ripe crops go in the bin by the door and the money comes overnight.','The village is east over the bridge. Be kind to them. Sleep before two." — Aunt Mirabel'])};
 try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>ui==='title'?{}:serialize())}catch(e){}
 requestAnimationFrame(frame)}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
