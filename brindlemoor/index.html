<title>Brindlemoor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: a framed window onto the town, a HUD rail above, parchment panels for talk, tasks and day cards */
:root{
  --walnut:#1d1814; --walnut-2:#2a221c; --walnut-3:#3b3027;
  --parch:#ecdfc2; --parch-2:#dccba5; --ink:#2a1f17; --ink-soft:#5b4a3a;
  --madder:#9c3b28; --gold:#c9a046; --moss:#6d8a3c; --muted:#b9a787;
  --f-display:"IM Fell English SC", Georgia, "Times New Roman", serif;
  --f-body:"IM Fell English", Georgia, "Times New Roman", serif;
  --f-pixel:"Pixelify Sans", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--walnut);color:var(--parch)}
body{font-family:var(--f-body);font-size:16px}
#app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.04em;color:var(--gold);margin:0}
.when{font-family:var(--f-pixel);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border:1px solid var(--muted);display:block}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.dots i.past{background:var(--walnut-3)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-family:var(--f-pixel);background:var(--walnut-2);border:1px solid var(--walnut-3);padding:3px 8px;display:flex;gap:6px;align-items:baseline}
.stat span{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
.stat b{color:var(--parch);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat.bump{animation:bump .6s ease-out}
@keyframes bump{0%{background:var(--gold)}100%{background:var(--walnut-2)}}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:336/224;border:3px solid #6b5332;box-shadow:0 0 0 1px #000,0 0 0 7px var(--walnut-2),0 12px 30px rgba(0,0,0,.5);background:#0d0b09;overflow:hidden;user-select:none;-webkit-user-select:none}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.prompt{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(29,24,20,.88);color:var(--parch);font-family:var(--f-pixel);font-size:13px;padding:4px 10px;border:1px solid var(--gold);white-space:nowrap;pointer-events:none}
.prompt b{color:var(--gold)}
.toast{position:absolute;top:42px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;font-style:italic;font-size:clamp(15px,2vw,19px);color:var(--parch);text-shadow:0 1px 0 #000,0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .4s}
.toast.show{opacity:1}
.dialog{position:absolute;left:8px;right:8px;bottom:8px;background:var(--parch);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--parch-2),0 4px 0 rgba(0,0,0,.45);padding:9px 14px 12px;font-size:clamp(15px,2.1vw,19px);line-height:1.35;cursor:pointer;max-height:calc(100% - 16px);overflow:auto}
.dialog .who{font-family:var(--f-display);color:var(--madder);font-size:.95em;letter-spacing:.03em}
.dialog .txt{min-height:2.6em}
.dialog .more{position:absolute;right:10px;bottom:4px;font-family:var(--f-pixel);font-size:12px;color:var(--ink-soft);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.choice{font:inherit;text-align:left;background:transparent;border:1px solid transparent;color:var(--ink);padding:3px 8px;cursor:pointer}
.choice.sel,.choice:hover{background:var(--parch-2);border-color:var(--ink-soft)}
.choice:focus-visible,.btn:focus-visible,.opt:focus-visible,.sw:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.n{font-family:var(--f-pixel);color:var(--madder);margin-right:6px;font-size:.8em}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:10px;overflow:auto}
.mini{background:rgba(15,10,8,.55)}
.screen{background:rgba(18,13,10,.84)}
.panel{background:var(--parch);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 3px var(--parch-2),0 6px 0 rgba(0,0,0,.4);padding:14px 18px;width:min(470px,100%);font-size:16px;line-height:1.4}
.panel p{margin:6px 0}
.mt{font-family:var(--f-display);font-size:23px;color:var(--madder);line-height:1.1}
.bar,.gauge{position:relative;height:24px;background:#cbb88f;border:2px solid var(--ink);margin:12px 0 8px}
.zone,.gz{position:absolute;top:0;bottom:0;background:var(--moss)}
.mark{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--ink)}
.gf{position:absolute;left:0;top:6px;bottom:6px;background:var(--madder);mix-blend-mode:multiply}
.hotline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--madder)}
.timebar{height:6px;background:#cbb88f;border:1px solid var(--ink)}
.timebar div{height:100%;background:var(--ink-soft);width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-pixel);font-size:13px;color:var(--ink-soft)}
.pips{display:flex;gap:4px}
.pips i{display:block;width:14px;height:14px;border:2px solid var(--ink)}
.pips i.on{background:var(--gold)}
.fb{font-style:italic;min-height:1.4em}
.btn{font-family:var(--f-pixel);font-size:16px;background:var(--madder);color:#fbeedd;border:2px solid var(--ink);padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
kbd{font-family:var(--f-pixel);font-size:.72em;opacity:.85;border:1px solid currentColor;padding:0 4px;margin-left:6px}
.lake{height:34px;background:#3c6e9e;border:2px solid var(--ink);position:relative;overflow:hidden;margin:8px 0}
.lake span{position:absolute;top:50%;width:12px;height:6px;margin-top:-3px;border:2px solid rgba(255,255,255,.85);border-radius:50%;animation:rip .7s ease-out forwards}
.lake span.tob{border-color:rgba(232,200,90,.9)}
@keyframes rip{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.4);opacity:.55}}
.qn{font-family:var(--f-pixel);font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.q{font-size:19px}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{font:inherit;text-align:left;background:#f4ead3;border:2px solid var(--ink-soft);color:var(--ink);padding:6px 10px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt.right{background:#c9d6a3;border-color:var(--moss)}
.opt.wrong{background:#e7b9a8;border-color:var(--madder)}
.card{width:min(560px,100%)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);color:var(--madder);margin:0;line-height:1.05;text-wrap:balance}
.card .eyebrow{font-family:var(--f-pixel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.card ul{margin:8px 0;padding-left:20px}
.card li{margin:2px 0}
.statline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.statline span{font-family:var(--f-pixel);font-size:13px;border:1px solid var(--ink-soft);padding:2px 8px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-family:var(--f-pixel);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.field input{font:inherit;font-size:20px;background:#f7efdc;color:var(--ink);border:2px solid var(--ink);padding:4px 8px;max-width:240px}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--parch),0 0 0 5px var(--madder)}
.big{font-size:clamp(34px,6vw,54px)!important}
.below{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.obj{font-size:17px;min-width:0}
.obj b{font-family:var(--f-display);font-weight:400;color:var(--gold);margin-right:8px}
.hint{font-family:var(--f-pixel);font-size:12px;color:var(--muted)}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.dpad button,.abtn{background:var(--walnut-2);color:var(--parch);border:2px solid var(--walnut-3);font-size:18px;touch-action:none}
.dpad button:active,.dpad button.on{background:var(--walnut-3)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.abtn{width:78px;height:78px;border-radius:50%;background:var(--madder);border-color:var(--ink);font-family:var(--f-pixel);font-size:24px;color:#fbeedd}
.gcv{width:100%;height:auto;display:block;image-rendering:pixelated;border:2px solid var(--ink);margin:8px 0;background:#5f8f3e;max-width:100%}
.osr{font-family:var(--f-display);font-size:30px;text-align:center;min-height:42px;margin:8px 0}
.parry{justify-content:center}
.prices{font-family:var(--f-pixel);font-size:13px;color:var(--ink-soft);margin-top:4px}
.card .opt b{color:var(--madder);font-weight:400;font-family:var(--f-display)}
#g3{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hp3{position:absolute;left:10px;bottom:10px;width:min(220px,44%);display:flex;flex-direction:column;gap:3px;pointer-events:none;font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--parch);text-shadow:0 1px 0 #000}
.h3b{height:10px;background:rgba(29,24,20,.82);border:1px solid #000}
.h3b i{display:block;height:100%;width:100%;background:var(--madder);transition:width .15s}
.h3b.mor i{background:var(--gold)}
.hp3 .bread{text-transform:none;letter-spacing:0;font-size:12px}
.pad3{display:flex;flex-direction:column;gap:6px}
.pad3 button{width:68px;height:44px;background:var(--walnut-2);color:var(--parch);border:2px solid var(--walnut-3);font-family:var(--f-pixel);font-size:14px;touch-action:none}
.pad3 button.on,.pad3 button:active{background:var(--walnut-3)}
@media (hover:none) and (pointer:coarse){.pad{display:flex}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.dialog .more,.stat.bump,.lake span{animation:none}.toast{transition:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand"><h1>Brindlemoor</h1><div class="when"><span id="whenTxt">Day 1 · Age 8</span><span class="dots" id="dots"><i></i><i></i><i></i><i></i></span><span id="periodTxt">Morning</span></div></div>
    <div class="stats">
      <div class="stat" id="st-str"><span>Strength</span><b>1</b></div>
      <div class="stat" id="st-wits"><span>Wits</span><b>1</b></div>
      <div class="stat" id="st-charm"><span>Charm</span><b>1</b></div>
      <div class="stat" id="st-arms" hidden><span>Arms</span><b>0</b></div>
      <div class="stat" id="st-coin"><span>Pennies</span><b>0</b></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="game" width="336" height="224" aria-label="The town of Brindlemoor"></canvas>
    <canvas id="g3" hidden aria-label="The battlefield in 3D"></canvas>
    <div class="hp3" id="hp3" hidden><div>Health</div><div class="h3b"><i class="hpf"></i></div><div class="morw" hidden><div>The line holds</div><div class="h3b mor"><i class="mf"></i></div></div><div class="bread"></div></div>
    <div class="prompt" id="prompt" hidden></div>
    <div class="toast" id="toast"></div>
    <div class="dialog" id="dialog" hidden><div class="who" id="dWho"></div><div class="txt" id="dTxt"></div><div class="choices" id="dCh"></div><div class="more" id="dMore">▼</div></div>
    <div class="overlay mini" id="mini" hidden><div class="panel" id="miniPanel"></div></div>
    <div class="overlay screen" id="screen" hidden><div class="panel card" id="screenPanel"></div></div>
  </div>
  <div class="below"><div class="obj" id="obj"><b>Now</b><span id="objTxt"></span></div><div class="hint">Move: WASD or arrows · Act: E or Space · Choose: 1–3</div></div>
  <div class="pad" id="pad">
    <div class="dpad"><button class="u" data-k="arrowup" aria-label="Up">▲</button><button class="l" data-k="arrowleft" aria-label="Left">◀</button><button class="r" data-k="arrowright" aria-label="Right">▶</button><button class="d" data-k="arrowdown" aria-label="Down">▼</button></div>
    <div class="pad3" id="pad3" hidden><button id="bBlock" type="button">Block</button><button id="bTalk" type="button">Talk</button><button id="bHeal" type="button">Eat</button></div>
    <button class="abtn" id="abtn" aria-label="Act">A</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const TS=16, MW=44, MH=32;
let VW=336, VH=224;
const $=s=>document.querySelector(s);
const stage=$('#stage'), cvs=$('#game'), ctx=cvs.getContext('2d');
const lc=document.createElement('canvas'), lx=lc.getContext('2d');
const TOUCH=matchMedia('(hover:none) and (pointer:coarse)').matches;
const KEY=TOUCH?'A':'E';
const PERIODS=['Morning','Afternoon','Evening','Night'];

function fit(){
  const w=stage.clientWidth;
  VH = w<620 ? 300 : 224;
  stage.style.aspectRatio=VW+'/'+VH;
  cvs.width=VW; cvs.height=VH; lc.width=VW; lc.height=VH;
  ctx.imageSmoothingEnabled=false;
}
fit(); addEventListener('resize',fit);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=rng(1342);

/* ---------- MAP ---------- */
const T=[],SOL=[],RES=[];
for(let y=0;y<MH;y++){T.push(new Array(MW).fill('g'));SOL.push(new Array(MW).fill(0));RES.push(new Array(MW).fill(0));}
function fill(x,y,w,h,c){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(j>=0&&j<MH&&i>=0&&i<MW)T[j][i]=c;}
fill(35,3,3,29,'~');
fill(39,4,5,10,'f'); fill(39,19,5,12,'f'); fill(1,20,4,11,'f');
fill(20,3,3,29,'p');
fill(1,15,34,2,'p'); fill(35,15,3,2,'b'); fill(38,15,6,2,'p');
fill(15,11,13,9,'c');
fill(8,26,12,1,'p');      // home path
fill(10,12,1,3,'p');      // forge path
fill(29,10,1,5,'p');      // chapel path
fill(16,9,1,2,'p');       // tavern path
fill(4,9,1,6,'p');        // west house path
fill(23,26,4,1,'p');      // widow's path
fill(0,0,MW,3,'W'); fill(20,1,3,2,'G');

const BUILD=[
  {id:'home',x:6,y:22,w:5,h:4,roof:'thatch',door:8},
  {id:'forge',x:8,y:8,w:6,h:4,roof:'slate',door:10,chimney:12},
  {id:'chapel',x:27,y:4,w:6,h:6,roof:'slate',door:29,stone:true,tower:true},
  {id:'hesk',x:25,y:22,w:4,h:4,roof:'tile',door:26},
  {id:'tavern',x:14,y:4,w:6,h:5,roof:'tile',door:16,sign:true},
  {id:'hA',x:2,y:5,w:5,h:4,roof:'thatch',door:4},
  {id:'hC',x:10,y:17,w:5,h:4,roof:'thatch',door:12},
  {id:'hD',x:29,y:18,w:5,h:4,roof:'tile',door:31},
];
const PROPS=[
  {k:'well',x:18,y:13},
  {k:'stall',x:23,y:12,w:3,goods:'bread'},
  {k:'stall',x:16,y:17,w:3,goods:'toys'},
  {k:'lamp',x:15,y:11},{k:'lamp',x:27,y:11},{k:'lamp',x:15,y:19},{k:'lamp',x:27,y:19},
  {k:'oak',x:31,y:28},
  {k:'board',x:26,y:18},
];
for(let y=0;y<3;y++)for(let x=0;x<MW;x++)SOL[y][x]=1;
for(let y=3;y<MH;y++)for(let x=0;x<MW;x++)if(T[y][x]==='~')SOL[y][x]=1;
for(const b of BUILD){
  for(let j=b.y;j<b.y+b.h;j++)for(let i=b.x;i<b.x+b.w;i++)SOL[j][i]=1;
  for(let j=b.y-1;j<=b.y+b.h+1;j++)for(let i=b.x-1;i<=b.x+b.w;i++)if(RES[j]&&RES[j][i]!==undefined)RES[j][i]=1;
}
for(const p of PROPS){const w=p.w||1;for(let i=0;i<w;i++)SOL[p.y][p.x+i]=1;
  for(let j=p.y-2;j<=p.y+2;j++)for(let i=p.x-2;i<=p.x+w+1;i++)if(RES[j]&&RES[j][i]!==undefined)RES[j][i]=1;}

/* ---------- LOOKS & NPCs ---------- */
const LOOK={
  mother:{skin:'#e8b98f',hair:'#6b3d22',top:'#7b4b6a',bot:'#5a3a50',apron:'#e6dcc4',kerchief:'#d8cfb6'},
  bram:{skin:'#c98f63',hair:'#2a1c14',top:'#5b4636',bot:'#3a2e25',apron:'#3b2a1e',beard:'#2a1c14'},
  aldous:{skin:'#e3b48c',hair:'#b9b1a2',top:'#5a4a38',bot:'#5a4a38',robe:true,tonsure:true},
  mae:{skin:'#f0c6a0',hair:'#c2702e',top:'#a8573a',bot:'#6b4a2e',apron:'#efe6d0',kerchief:'#efe6d0'},
  pell:{skin:'#d9a57c',hair:'#8a8a8a',top:'#3d5f6b',bot:'#4a3a2a',hat:'#7a2e2e',beard:'#9a9a9a'},
  tobin:{skin:'#e9bb92',hair:'#d8b34a',top:'#55753a',bot:'#6b4f33',kid:true},
  guard:{skin:'#d7a47c',hair:'#3a2a1c',top:'#8a2f2a',bot:'#3a3a40',helm:'#9aa0a8',spear:true},
  herald:{skin:'#e6b48a',hair:'#3a2a1c',top:'#2f4f8a',bot:'#c9a046',hat:'#2f4f8a',feather:true},
  v1:{skin:'#d9a57c',hair:'#4a3020',top:'#6b6b3a',bot:'#4a3a2a'},
  v2:{skin:'#efc4a0',hair:'#a0602a',top:'#8a5a7a',bot:'#4a3a50',kerchief:'#cfc4a8'},
  v3:{skin:'#b97c55',hair:'#1e1612',top:'#4a6a7a',bot:'#3a3028',hat:'#5a4a30'},
  father:{skin:'#d9a57c',hair:'#4a3020',top:'#5a5a3a',bot:'#4a3a2a',beard:'#4a3020',crutch:true},
  steward:{skin:'#e6b48a',hair:'#2a2420',top:'#3a2f4a',bot:'#2a2430',hat:'#1f1a24'},
  vane:{skin:'#c98f63',hair:'#5a3a22',top:'#8a2f2a',bot:'#3a3a40',helm:'#7d838c',beard:'#5a3a22'},
  elsbeth:{skin:'#efc4a0',hair:'#8a5a2a',top:'#6b6050',bot:'#4a4038',teen:true,kerchief:'#9a8f78'},
  tobinT:{skin:'#e9bb92',hair:'#d8b34a',top:'#55753a',bot:'#6b4f33',teen:true},
  tobinA:{skin:'#e3b48c',hair:'#d8b34a',top:'#55753a',bot:'#6b4f33',beard:'#c9a040'},
  aldric4:{skin:'#e3b48c',hair:'#8a5a2a',top:'#6b6050',bot:'#4a4038',beard:'#8a5a2a'},
  elsbeth4:{skin:'#efc4a0',hair:'#8a5a2a',top:'#7a5a7a',bot:'#4a4038',apron:'#e6dcc4'},
  lord:{skin:'#e6b48a',hair:'#8a8a8a',top:'#5a2a6a',bot:'#2a2430',beard:'#9a9a9a',hat:'#c9a046'},

function objective(){
  if(S.ch===13&&!S.c13war)return objective13();
  if(S.ch===11)return objective11();
  if(S.ch===10)return objective10();
  if(S.ch===9)return objective9();
  if(S.ch===6)return objective6();
  if(S.ch===5)return objective5();
  if(S.ch===4)return objective4();
  if(S.ch===3||S.ch===7||S.ch===8||S.ch===12||(S.ch===13&&!!S.c13war))return C3.objective();
  if(S.ch===2)return objective2();
  if(S.flags.bread){const left=Math.max(0,Math.ceil((S.flags.bread.until-performance.now())/1000));return left>0?`Run the loaf to Widow Hesk’s red-roofed house, east of the big road. Still warm for ${left}s.`:'The loaf has gone cold. Deliver it to Widow Hesk anyway.';}
  if(S.day===1&&S.flags.water==='none')return'Mother is calling from outside the house.';
  if(S.day===1&&S.flags.water==='need')return'Fetch water from the well in the market square.';
  if(S.day===1&&S.flags.water==='full')return'Bring the full bucket home to Mother.';
  if(S.period===3)return'Night has fallen. Go home and talk to Mother to sleep.';
  if(S.day===3&&!S.flags.herald)return'A royal herald has come to the market square.';
  if(S.period===2)return'Evening. Time for one more thing, or head home to Mother.';
  if(S.day===2&&S.period===0)return'Market day. Mae, Bram, Aldous and Tobin might all have something for you.';
  return'Explore Brindlemoor. Each job or game takes up part of the day.';
}
function advance(){
  if(S.ch===2&&S.period===0&&!S.done.shift&&!S.flags['missed'+S.day]){S.flags['missed'+S.day]=1;S.log.push('Missed the morning shift. No wage today.');}
  S.period=Math.min(3,S.period+1);
  const m=['','The chapel bell rings. It is afternoon.','The sun sinks behind the wall. Evening.','Night falls. Lamps are lit. Head home to Mother.'];
  toast(m[S.period]);hud();save();onAdvance5();onAdvance9();
}

  if(D.choices){D.ch.innerHTML='';D.choices.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='choice'+(i===0?' sel':'');b.innerHTML=`<span class="n">${i+1}</span>${c}`;b.onclick=e=>{e.stopPropagation();dPick(i)};D.ch.appendChild(b);});D.more.hidden=true;}
  else D.more.hidden=false;
}
function dAction(){if(D.typing){dShowChoices();return;}if(D.choices){dPick(D.sel);return;}dClose(-1);}
function dMove(d){if(!D.choices||D.typing)return;D.sel=(D.sel+d+D.choices.length)%D.choices.length;[...D.ch.children].forEach((b,i)=>b.classList.toggle('sel',i===D.sel));}
function dPick(i){if(D.typing||!D.choices||i<0||i>=D.choices.length)return;dClose(i);}
function dClose(v){D.el.hidden=true;mode='play';const r=D.res;D.res=null;r&&r(v);}
D.el.addEventListener('click',()=>{if(mode==='dialog')dAction();});

/* ---------- OVERLAYS ---------- */
const mini={el:$('#mini'),panel:$('#miniPanel'),action:null,pick:null,key:null};
function openMini(html){mode='mini';mini.action=null;mini.pick=null;mini.key=null;mini.panel.innerHTML=html;mini.el.hidden=false;return mini.panel;}
function closeMini(){mini.el.hidden=true;mini.action=null;mini.pick=null;mini.key=null;mode='play';}
function screen(html,btn,alt){
  return new Promise(res=>{
    mode='screen';const p=$('#screenPanel');p.innerHTML=html+`<div class="btns"><button class="btn primary" type="button">${btn}</button>${alt?`<button class="btn ghost alt" type="button">${alt}</button>`:''}</div>`;
    $('#screen').hidden=false;
    p.querySelector('.primary').onclick=()=>{$('#screen').hidden=true;res(0)};
    if(alt)p.querySelector('.alt').onclick=()=>{$('#screen').hidden=true;res(1)};
  });
}

/* ---------- MINIGAMES ---------- */
function miniTiming(o){return new Promise(res=>{
  const el=openMini(`<div class="mt">${o.title}</div><p>${o.intro}</p>
  <div class="bar"><div class="zone"></div><div class="mark"></div></div>
  <div class="row"><div class="pips">${'<i></i>'.repeat(o.need)}</div><div class="tries"></div></div>
  <p class="fb">&nbsp;</p><button class="btn act" type="button">${o.btn}<kbd>${KEY}</kbd></button>`);
  const zone=el.querySelector('.zone'),mark=el.querySelector('.mark'),fb=el.querySelector('.fb'),pips=[...el.querySelectorAll('.pips i')],tries=el.querySelector('.tries');
  let z=o.zone,zx=0,hits=0,used=0,t=Math.random()*6,pos=0,cool=0,over=false,last=performance.now();
  const place=()=>{zx=.06+Math.random()*(.88-z);zone.style.left=zx*100+'%';zone.style.width=z*100+'%';};place();
  const upd=()=>tries.textContent=`${o.tries-used} tries left`;upd();
  (function frame(now){if(over)return;const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt*o.speed;pos=(Math.sin(t)+1)/2;mark.style.left=`calc(${pos*100}% - 2px)`;cool-=dt;requestAnimationFrame(frame);})(last);
  mini.action=()=>{if(over||cool>0)return;cool=.3;used++;
    if(pos>=zx&&pos<=zx+z){hits++;pips[hits-1].className='on';fb.textContent=o.hit[Math.min(hits-1,o.hit.length-1)];z=Math.max(.09,z-o.shrink);place();}
    else fb.textContent=o.miss[Math.floor(Math.random()*o.miss.length)];
    upd();if(hits>=o.need||used>=o.tries){over=true;setTimeout(()=>{closeMini();res(hits)},850);}};
  el.querySelector('.act').onclick=()=>mini.action&&mini.action();
});}

function miniBellows(){return new Promise(res=>{
  const el=openMini(`<div class="mt">Work the bellows</div><p>Keep the fire inside the green band until the sand runs out. Each pump adds heat. Too much and Bram roars.</p>
  <div class="gauge"><div class="gz" style="left:55%;width:25%"></div><div class="gf"></div><div class="hotline" style="left:90%"></div></div>
  <div class="row"><span>Cold</span><span>Working heat</span><span>Too hot</span></div>
  <div class="timebar" style="margin-top:8px"><div></div></div><p class="fb">Press to start pumping.</p>
  <button class="btn act" type="button">Pump<kbd>${KEY}</kbd></button>`);
  const gf=el.querySelector('.gf'),fb=el.querySelector('.fb'),tb=el.querySelector('.timebar div');
  let heat=30,t=0,inz=0,started=false,over=false,last=performance.now();const DUR=10;
  (function frame(now){if(over)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(started){t+=dt;heat=Math.max(0,heat-dt*21);if(heat>=55&&heat<=80)inz+=dt;
      fb.textContent=heat>90?'Too hot! The iron spits sparks.':heat>=55&&heat<=80?'Good, steady heat.':heat>80?'Getting hot…':'The coals are dimming. Pump!';
      tb.style.width=Math.max(0,100-t/DUR*100)+'%';
      if(t>=DUR){over=true;const sc=inz/DUR;fb.textContent=sc>.6?'Bram nods. "Good arms on you."':sc>.35?'"Not bad for a sprout."':'"We’ll make a smith of you yet. Maybe."';setTimeout(()=>{closeMini();res(sc)},1100);return;}}
    gf.style.width=heat+'%';requestAnimationFrame(frame);})(last);
  mini.action=()=>{if(over)return;started=true;heat=Math.min(100,heat+10);};
  el.querySelector('.act').onclick=()=>mini.action&&mini.action();
});}

const QUIZ=[
  ['Which letter does SWORD begin with?',['S','W','C'],0],
  ['Three apples sit on the table, and Brother Aldous adds four more. How many now?',['6','7','8'],1],
  ['Which word is spelled right?',['Castel','Cassle','Castle'],2],
  ['The sign over the stall reads B _ K E R. Which letter is missing?',['A','O','U'],0],
  ['A loaf costs 2 pennies. What do 3 loaves cost?',['5','6','8'],1],
  ['Which letter comes first in the alphabet?',['K','M','G'],2],
  ['Which word rhymes with KING?',['Ring','Crown','Kind'],0],
  ['Twelve pennies make one shilling. How many pennies are in two shillings?',['20','22','24'],2],
  ['Which of these is a young horse?',['Foal','Calf','Kid'],0],
  ['The bell rings at noon. Three hours later, what hour is it?',['Two','Three','Four'],1],
  ['Which letter does LANTERN end with?',['N','R','T'],0],
  ['How many legs do two hens have between them?',['2','4','6'],1],
];
function miniQuiz(n){return new Promise(res=>{
  let pool=QUIZ.map((q,i)=>i).filter(i=>!S.quizUsed.includes(i));if(pool.length<n){S.quizUsed=[];pool=QUIZ.map((q,i)=>i);}
  pool.sort(()=>Math.random()-.5);const qs=pool.slice(0,n);S.quizUsed.push(...qs);
  let i=0,right=0,locked=false;
  openMini('');
  function show(){const [q,opts]=QUIZ[qs[i]];locked=false;
    mini.panel.innerHTML=`<div class="mt">Lesson with Brother Aldous</div><div class="qn">Question ${i+1} of ${n}</div><p class="q">${q}</p><div class="opts">${opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span class="n">${j+1}</span>${o}</button>`).join('')}</div><p class="fb">&nbsp;</p>`;
    mini.panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));}
  function answer(j){if(locked)return;const [,opts,c]=QUIZ[qs[i]];if(j<0||j>=opts.length)return;locked=true;const bs=mini.panel.querySelectorAll('.opt');bs[c].classList.add('right');
    const fb=mini.panel.querySelector('.fb');if(j===c){right++;fb.textContent='"Bene. Well done, child."';}else{bs[j].classList.add('wrong');fb.textContent=`"Not quite. It is ${opts[c]}."`;}
    setTimeout(()=>{i++;if(i<n)show();else{closeMini();res(right);}},1000);}
  mini.pick=answer;show();
});}

function miniSkip(RV){RV=RV||'Tobin';return new Promise(res=>{
  const el=openMini(`<div class="mt">Skipping stones</div><p>Stop the swing on the red notch for a flat, fast throw. Best of three against ${RV}.</p>
  <div class="bar"><div class="zone" style="left:78%;width:12%;background:#c98a5a"></div><div class="hotline" style="left:84%"></div><div class="mark"></div></div>
  <div class="lake"></div><div class="row"><span class="you">You: best 0</span><span class="throws">3 throws left</span><span class="tob">${RV}: best 0</span></div>
  <p class="fb">&nbsp;</p><button class="btn act" type="button">Throw<kbd>${KEY}</kbd></button>`);
  const mark=el.querySelector('.mark'),lake=el.querySelector('.lake'),fb=el.querySelector('.fb');
  let t=0,pos=0,last=performance.now(),over=false,wait=false,n=0,best=0,tb=0;
  (function frame(now){if(over)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!wait){t+=dt*1.15;pos=1-Math.abs((t%2)-1);mark.style.left=`calc(${pos*100}% - 2px)`;}requestAnimationFrame(frame);})(last);
  function ripples(k,cls,row){for(let i=0;i<k;i++)setTimeout(()=>{const s=document.createElement('span');s.className=cls;s.style.left=(6+i*12)+'%';s.style.top=row;lake.appendChild(s);},i*130);}
  mini.action=()=>{if(over||wait)return;wait=true;n++;lake.innerHTML='';
    const d=Math.abs(pos-.84);const k=pos>.97?0:d<.03?7:d<.07?5:d<.15?3:d<.3?1:0;
    const tob=2+Math.floor(Math.random()*4);best=Math.max(best,k);tb=Math.max(tb,tob);
    ripples(k,'','35%');setTimeout(()=>ripples(tob,'tob','70%'),k*130+300);
    fb.textContent=(k===0?(pos>.97?'Too hard. Plunk.':'It sinks without a skip.'):`${k} skips!`)+` ${RV} gets ${tob}.`;
    el.querySelector('.you').textContent='You: best '+best;el.querySelector('.tob').textContent=RV+': best '+tb;el.querySelector('.throws').textContent=(3-n)+' throws left';
    setTimeout(()=>{wait=false;if(n>=3){over=true;closeMini();res({best,tb});}},Math.max(k,tob)*130+1300);};
  el.querySelector('.act').onclick=()=>mini.action&&mini.action();
});}

/* ---------- SCRIPTS ---------- */
const N=()=>S.name;
async function runScript(fn){if(busy)return;busy=true;try{await fn();}catch(e){console.error(e);}busy=false;if(mode!=='screen')mode='play';hud();save();}
const done=k=>!!S.done[k];
const late=()=>S.period>=3;

async function talkMother(){
  if(S.ch===6)return talk6('mother');
  if(S.ch===5)return talk5('mother');
  if(S.ch===4)return talkMother4();
  if(S.ch===2)return talkMother2();
  if(S.day===1&&S.flags.water==='full'){
    S.flags.water='done';S.log.push('Hauled a full bucket home for Mother.');gain('charm',1);
    await say('Mother','Full to the brim! Your father would be proud of you.');
    if(S.period<2){await say('Mother','Go on then, the day is yours. But be home when the lamps are lit.');return;}
  }
  if(S.period<2&&S.day===1&&S.flags.water==='none'){
    await say('Mother',`${N()}! Up with the roosters, good. The water barrel is dry as old bones.`);
    await say('Mother','Take the bucket to the well in the market square, up the path and along the big road. Fill it, and mind you don’t fall in.');
    S.flags.water='need';return;
  }
  if(S.period<2&&S.day===1&&S.flags.water==='need'){await say('Mother','The well is in the market square. Bucket first, then you can run off and play.');return;}
  if(S.period>=2){
    if(S.day===3&&!S.flags.letter){
      S.flags.letter=1;
      await say('Mother','Sit with me a moment. A letter came today, from your father. Brother Aldous read it to me.');
      await say('Mother',`"To my dear wife, and to ${N()}. We are camped by the river Sele. The bread is hard but the company is good."`);
      await say('Mother',`"Tell ${N()} to mind you, and to practise with a stick every day. I will be home by harvest."`);
      await say('Mother',S.flags.herald?'And now the Lord calls for more of us. Well. Your father always comes home. Always.':'They say a herald came to the square today. More men called north. Well. Your father always comes home.');
      S.log.push('Heard Father’s letter from the north.');
    }
    const c=await say('Mother',S.period===3?'There you are. Wash your face. Supper, then bed.':'Home early? There’s pottage on the fire.',['Go to bed','Not yet']);
    if(c===0)await sleep();
    return;
  }
  if(S.day===1){await say('Mother','Off you go. Bram might need help at the forge, and that Tobin is always down by the river.');return;}
  if(S.day===2){await say('Mother','Market day! Mae could use quick feet, and Brother Aldous asked after you at church.');return;}
  await say('Mother','A horn sounded from the castle before dawn. Folk are gathering in the square. Stay where I can find you today.');
}

async function useWell(){
  if(S.ch===13)return talk13('well');
  if(S.ch===11)return talk11('well');
  if(S.ch===10)return talk10('well');
  if(S.ch===9)return talk9('well');
  if(S.ch===6)return talk6('well');
  if(S.ch===5)return talk5('well');
  if(S.ch===4){await say(N(),'You draw a bucket and drink. Cold and clean. The water at the ford tasted of mud and iron.');return;}
  if(S.ch===2){await say(N(),'You draw a bucket for old times\u2019 sake. The rope feels lighter than it used to.');return;}
  if(S.day===1&&S.flags.water==='need'){
    if(late()){await say(N(),'Too dark to see the bucket now.');return;}
    const hits=await miniTiming({title:'Draw water',intro:'Heave on the rope when the marker passes the green mark. Three good pulls bring the bucket up.',btn:'Heave',need:3,tries:6,zone:.24,speed:2.6,shrink:.03,
      hit:['Heave! The rope creaks.','Heave! Nearly there.','Up it comes, sloshing!'],miss:['The rope slips through your fingers.','Too early. The bucket bangs the stones.','Too late. Splash.']});
    if(hits>=3){S.flags.water='full';S.log.push('Drew water from the well (+1 Strength).');gain('str',1);await say(N(),'The bucket is heavy, but it’s full. Better carry it home to Mother.');}
    else{S.flags.water='full';S.log.push('Drew half a bucket from the well, the hard way.');await say(N(),'Half the water sloshed out on the cobbles. Still, it’s something. Better take it home.');}
    advance();return;
  }
  const lines=['You peer down into the dark. Your reflection peers back.','You drop a pebble in. It takes a long time to splash.','Someone has scratched a heart and two letters into the well stones.'];
  await say(N(),lines[S.day-1]||lines[0]);
}

async function talkBram(){
  if(S.ch===5)return talk5('bram');
  if(S.ch===4)return talkMaster4('bram');
  if(S.ch===2)return talkMaster2('bram');
  if(late())return;
  if(done('bellows')){await say('Bram the smith','Good work today. Come back tomorrow, arms like those need practice.');return;}
  const intro=S.day===1?'Oi, small one. Mind the sparks. Want to work the bellows for me? Keep the fire hot and I’ll pay a penny or two.'
    :S.day===2?'Market day means horseshoes, and horseshoes mean heat. Bellows again?'
    :'The Lord wants fifty spearheads by the new moon. Fifty! I need every pair of hands. Even small ones.';
  const c=await say('Bram the smith',intro,['Work the bellows','Maybe later']);
  if(c!==0)return;
  const sc=await miniBellows();
  const coins=sc>.6?3:sc>.35?2:1;
  S.done.bellows=1;gain('coin',coins);if(sc>.35)gain('str',1);
  S.log.push(`Worked the forge bellows for Bram (+${coins} pennies${sc>.35?', +1 Strength':''}).`);
  await say('Bram the smith',sc>.6?`Steady as an ox. Here, ${coins} pennies. You’ve the makings of a smith.`:sc>.35?`Not bad. ${coins} pennies, and don’t spend them all on honey cakes.`:'Hmm. The iron’s half cold. Here’s a penny for trying.');
  advance();
}

async function talkAldous(){
  if(S.ch===6)return talk6('aldous');
  if(S.ch===5)return talk5('aldous');
  if(S.ch===4)return talkMaster4('aldous');
  if(S.ch===2)return talkMaster2('aldous');
  if(late())return;
  if(done('lesson')){await say('Brother Aldous','Go and practise your letters on the dirt with a stick. Learning grows like barley: slowly, then all at once.');return;}
  const intro=S.day===1?'Peace be with you, child. Do you know your letters? Sit with me a while and I will teach you.'
    :S.day===2?`Ah, ${N()}. Even on market day there is time for learning. Another lesson?`
    :'Dark times bring hard news, and hard news comes written down. Even a soldier must read his orders. Sit.';
  const c=await say('Brother Aldous',intro,['Take a lesson','Not today']);
  if(c!==0)return;
  const right=await miniQuiz(4);

async function heskDoor(){

  if(S.ch===11)return talk11('house');
  if(S.ch===10)return talk10('house');
  if(S.ch===9)return talk9('house');

  if(S.ch===5)return talk5('house');

  else{await say('Widow Hesk','Still warm! Oh, bless you, child. You remind me of my Edwin when he was small. Take these, and don’t tell Mae I overpaid.');gain('coin',pay);gain('charm',1);S.log.push(`Ran a warm loaf to Widow Hesk (+${pay} pennies, +1 Charm).`);}

async function talkPell(){

  if(S.ch===9)return talk9('pell');

async function skipStones(){
  const r=await miniSkip();
  S.done.tobin=1;gain('charm',1);
  if(r.best>r.tb){
    if(!S.items.includes('marble')){S.items.push('marble');await say('Tobin','No! You cheated. You didn’t cheat. Fine. Here, my lucky marble. You’ve earned it.');S.log.push('Beat Tobin at skipping stones and won his lucky marble (+1 Charm).');}
    else{await say('Tobin','Again?! The river likes you more than me.');S.log.push('Beat Tobin at skipping stones again (+1 Charm).');}
  }else{await say('Tobin',r.best===r.tb?'A tie! That means we both win. That’s a rule.':'Ha! The river king keeps his crown. You were close, though.');S.log.push('Skipped stones with Tobin by the river (+1 Charm).');}
  advance();
}
async function climbOak(){
  const strong=S.stats.str>=3;

  let round=0,blocks=0,phase='gap',tw=0,dir=0,win=1,last=performance.now(),over=false;const R_=8;
  function next(){if(round>=R_){over=true;osr.textContent=blocks>=6?'Osric lowers his sword, impressed.':'Osric lowers his sword.';osr.style.color='';setTimeout(()=>{closeMini();res(blocks)},900);return;}
    round++;phase='wait';tw=.7+Math.random()*1.2;osr.textContent='Osric circles you…';osr.style.color='';el.querySelector('.ph').textContent=`Round ${round} of ${R_}`;tb.style.width='100%';}
  function resolve(ok,msg){phase='gap';if(ok)blocks++;el.querySelector('.ps').textContent=blocks+' blocked';fb.textContent=msg;setTimeout(next,750);}
  (function frame(now){if(over)return;const dt=Math.min(.05,(now-last)/1000);last=now;
    if(phase==='wait'){tw-=dt;if(tw<=0){phase='swing';dir=rint(0,2);win=Math.max(.6,1.2-round*.07);tw=win;osr.textContent=DIRS[dir];osr.style.color='var(--madder)';}}
    else if(phase==='swing'){tw-=dt;tb.style.width=Math.max(0,tw/win*100)+'%';if(tw<=0)resolve(false,'Thwack! Too slow.');}
    requestAnimationFrame(frame);})(last);
  const pick=j=>{if(over)return;if(phase==='wait')resolve(false,'Too early! Osric taps your ribs.');else if(phase==='swing')resolve(j===dir,j===dir?'Clack! Blocked.':'Wrong side. Ow.');};
  mini.pick=j=>{if(j<3)pick(j);};mini.key=k=>{const m={arrowleft:0,a:0,arrowup:1,w:1,arrowright:2,d:2}[k];if(m!==undefined)pick(m);};
  el.querySelectorAll('.parry button').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
  next();
});}

async function useBoard(){

  const dx=t.x-src.x,dz=t.z-src.z,d=Math.hypot(dx,dz)||1,kb=(src.big?7:3.5)*(blocked?.5:1);

async function askRiddle(i){
  const r=RIDDLES[i];
  await say(N(),`The paper says: ${r.q}`);
  for(let tries=0;tries<4;tries++){
    const c=await say(N(),'Where does it point?',r.opts);
    if(c===r.c){S.c6.stage=i+1;await say('Wil',pickOne(['That’s it! Come on!','You’re a genius! Race you there!','Yes! I was just about to say that.']));toast(`Next: ${r.place}.`);hud();return;}
    await say('Wil',S.flags.wilWith?r.hint:'Hmm. That doesn’t sound right.');
  }
  S.c6.stage=i+1;await say(N(),`You puzzle it out at last: ${r.place}.`);hud();
}
async function parentWork(){
  const c=S.parent.c4f;let sc;

}

function objective10(){

async function lastLantern(){

  await say(g,'Is it going out? Is that the last of it?');

  await say(k,'The great lamp roars up gold. Far below, the town cheers. Far to the south, across the sea, you know a beacon is burning back.');

  $('#jump9').onclick=async()=>{const nm=($('#nameIn').value||'Wren').trim().slice(0,14)||'Wren';S=newState(nm,top);S.stats={str:5,wits:5,charm:5,coin:10,arms:3};S.items=['marble'];S.war={tobinSaved:1,aldric:1,aldricKnows:1};S.past={};S.master='forge';S.c8f='home';S.parent={name:nm==='Robin'?'Wren':'Robin',top:'#9c3b28',master:'forge',c4f:'trade',bond:6};$('#screen').hidden=true;await startCh9();};

  if(saved)$('#cont').onclick=()=>{S=saved;if(S.ch===3||S.ch===7||S.ch===8||S.ch===12||(S.ch===13&&!!S.c13war)){$('#screen').hidden=true;hud();if(!C3.begin()){S=null;titleScreen();}return;}S.flags.bread=null;S.flags.letters=null;C3.town();player.x=S.x;player.y=S.y;$('#screen').hidden=true;hud();mode='play';toast(`Day ${S.day}. ${PERIODS[S.period]}.`);};

/* ---------- INPUT ---------- */
const keys={};
function doAction(){
  if(mode==='dialog')dAction();
  else if(mode==='mini'){mini.action&&mini.action();}
  else if(mode==='play'){if(S&&(S.ch===3||S.ch===7||S.ch===8||S.ch===12||(S.ch===13&&!!S.c13war)))C3.attack();else interact();}
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'){const b=$('#begin');b&&b.click();}return;}
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)&&mode!=='screen')e.preventDefault();
  keys[k]=true;
  const act=k==='e'||k===' '||k==='enter';
  if(mode==='dialog'){if(act){e.preventDefault();if(!e.repeat)dAction();}else if(k==='arrowup'||k==='w')dMove(-1);else if(k==='arrowdown'||k==='s')dMove(1);else if(/^[1-4]$/.test(k))dPick(+k-1);}
  else if(mode==='mini'){if(act){e.preventDefault();if(!e.repeat&&mini.action)mini.action();}else if(/^[1-4]$/.test(k)&&mini.pick)mini.pick(+k-1);else if(mini.key)mini.key(k);}
  else if(mode==='play'){if(S&&(S.ch===3||S.ch===7||S.ch===8||S.ch===12||(S.ch===13&&!!S.c13war))){if(!e.repeat)C3.keydown(k);}else if(act&&!e.repeat){e.preventDefault();interact();}}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('.dpad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
$('#abtn').addEventListener('pointerdown',e=>{e.preventDefault();doAction();});

/* ---------- WORLD LOGIC ---------- */
const player={x:8*TS+8,y:26*TS+12,dir:'down',step:0,anim:0,moving:false};
const npcPos=n=>({x:n.tx*TS+8,y:n.ty*TS+14});
function solidTile(px_,py_){const tx=Math.floor(px_/TS),ty=Math.floor(py_/TS);if(tx<0||ty<0||tx>=MW||ty>=MH)return true;if(SOL[ty][tx])return true;
  for(const n of npcs)if(n.tx===tx&&n.ty===ty&&n.vis())return true;return false;}
function blocked(x,y){return solidTile(x-4,y-4)||solidTile(x+3,y-4)||solidTile(x-4,y-1)||solidTile(x+3,y-1);}
let target=null;
function findTarget(){
  let best=null,bd=1e9;
  for(const n of npcs){if(!n.vis())continue;const p=n.ip?{x:n.ip[0]*TS+8,y:n.ip[1]*TS+8}:npcPos(n);const r=n.ip?24:22;const d=Math.hypot(p.x-player.x,p.y-6-player.y+6);if(d<r&&d<bd){bd=d;best={label:n.label,act:n.act,npc:n};}}
  for(const h of hotspots){if(h.on&&!h.on())continue;const d0=Math.hypot(h.tx*TS+8-player.x,h.ty*TS+8-player.y),d=d0-(h.prio||0);if(d0<h.r&&d<bd){bd=d;best={label:h.label(),act:h.act};}}
  if(KID.on&&(S.ch===5||S.ch===6||S.ch===10)){const d=Math.hypot(KID.x-player.x,KID.y-player.y)+6;if(d<32&&d<bd){bd=d;best={label:'Talk to '+(S.ch===10?S.gc.name:S.ch===6?'Wil':S.kid.name),act:S.ch===10?()=>talk10('gc'):S.ch===6?()=>talk6('wil'):talkKid};}}
  for(const w of wanderers){if(S.period>=3||best)break;const d=Math.hypot(w.x-player.x,w.y-player.y);if(d<16&&d<bd){bd=d;best={label:'Talk',act:()=>say('A townsperson',w.lines[S.day%w.lines.length])}; }}
  return best;
}
function interact(){if(busy||!target)return;const t=target;
  if(t.npc){const p=npcPos(t.npc);const dx=player.x-p.x,dy=player.y-p.y;t.npc.face=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
  runScript(t.act);}

function update(dt){
  if(!S)return;
  if(mode==='play'&&!busy){
    let dx=0,dy=0;
    if(keys['arrowleft']||keys['a'])dx-=1;if(keys['arrowright']||keys['d'])dx+=1;if(keys['arrowup']||keys['w'])dy-=1;if(keys['arrowdown']||keys['s'])dy+=1;
    player.fwd=-dy;
    if(C3.isTown()&&(dx||dy)){const r=C3.camRel(dx,dy);dx=r[0];dy=r[1];}
    {const m=Math.hypot(dx,dy);if(m>1e-6){dx/=m;dy/=m;}}
    player.mvx=dx;player.mvy=dy;
    const sp=(C3.isTown()?(S.ch===10?44:52):64)*dt;player.moving=!!(dx||dy);
    if(dx){const nx=player.x+dx*sp;if(!blocked(nx,player.y))player.x=nx;}
    if(dy){const ny=player.y+dy*sp;if(!blocked(player.x,ny))player.y=ny;}
    if(dx||dy)player.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
    if(player.moving){player.anim+=dt*8;player.step=[0,1,0,2][Math.floor(player.anim)%4];}else player.step=0;
    S.x=player.x;S.y=player.y;S.dir=player.dir;kidTick(dt);
    target=findTarget();
  }else{target=null;}
  for(const n of npcs){if(n.face&&mode==='play'&&!busy){n.faceT=(n.faceT||0)+dt;if(n.faceT>2){n.face=null;n.faceT=0;}}}
  for(const w of wanderers){
    if(w.wait>0){w.wait-=dt;w.step=0;continue;}
    w[w.ax]+=w.dir*w.sp*dt;w.anim=(w.anim||0)+dt*6;w.step=[0,1,0,2][Math.floor(w.anim)%4];
    if(w[w.ax]>w.max){w[w.ax]=w.max;w.dir=-1;w.wait=1+Math.random()*2;}if(w[w.ax]<w.min){w[w.ax]=w.min;w.dir=1;w.wait=1+Math.random()*2;}
    const near=Math.hypot(w.x-player.x,w.y-player.y)<14;if(near){w.wait=.6;}
  }
  for(let i=floaters.length-1;i>=0;i--){floaters[i].t+=dt;if(floaters[i].t>1.6)floaters.splice(i,1);}
}

/* ---------- RENDER ---------- */
const smoke=[];let smokeT=0;
function render(time,dt){
  const t=time/1000;
  let cx,cy;
  if(S){cx=player.x-VW/2;cy=player.y-VH/2;}else{cx=21*TS-VW/2+Math.sin(t*.12)*160;cy=15*TS-VH/2+Math.cos(t*.09)*90;}
  cx=Math.round(Math.max(0,Math.min(MW*TS-VW,cx)));cy=Math.round(Math.max(0,Math.min(MH*TS-VH,cy)));
  ctx.fillStyle='#0d0b09';ctx.fillRect(0,0,VW,VH);
  ctx.drawImage(bg,cx,cy,VW,VH,0,0,VW,VH);
  /* water shimmer */
  const x0=Math.floor(cx/TS),y0=Math.floor(cy/TS);
  ctx.fillStyle='rgba(255,255,255,.28)';
  for(let y=y0;y<=y0+VH/TS+1&&y<MH;y++)for(let x=x0;x<=x0+VW/TS+1&&x<MW;x++){if(T[y]&&T[y][x]==='~'){const o=((t*6+y*5+x*3)%14);ctx.fillRect(x*TS-cx+o,y*TS-cy+((x*7+y*3)%11)+2,3,1);}}
  /* smoke */
  smokeT+=dt;if(smokeT>.22){smokeT=0;smoke.push({x:12*TS+8,y:8*TS-6,a:1,s:2});}
  for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.y-=dt*10;s.x+=Math.sin(t*2+i)*dt*4;s.a-=dt*.35;s.s+=dt*1.5;if(s.a<=0){smoke.splice(i,1);continue;}ctx.fillStyle=`rgba(190,185,175,${s.a*.55})`;ctx.fillRect(Math.round(s.x-cx-s.s/2),Math.round(s.y-cy-s.s/2),Math.round(s.s),Math.round(s.s));}
  /* sprites */
  const period=S?S.period:0;
  const list=[];
  if(S){
    for(const n of npcs){if(!n.vis())continue;const p=npcPos(n);list.push({y:p.y,f:()=>{
      let dir=n.face||n.dir||'down';drawPerson(ctx,p.x-cx,p.y-cy,n.L,dir,0);
      if(n.flag&&n.flag()&&S.period<3||(n.id==='mother'&&n.flag()&&S.period>=2)){const bx=p.x-cx,by=p.y-cy-(n.L.kid?20:24)+Math.round(Math.sin(t*4)*1.5);ctx.fillStyle='#ecdfc2';ctx.fillRect(bx-3,by-4,7,8);ctx.fillStyle='#2a1f17';ctx.fillRect(bx-3,by+4,7,1);ctx.fillRect(bx-4,by-3,1,6);ctx.fillRect(bx+4,by-3,1,6);ctx.fillRect(bx-3,by-5,7,1);ctx.fillStyle='#9c3b28';ctx.fillRect(bx,by-3,1,4);ctx.fillRect(bx,by+2,1,1);}
    }});}
    if(S.period<3)for(const w of wanderers){list.push({y:w.y,f:()=>drawPerson(ctx,w.x-cx,w.y-cy,w.L,w.ax==='x'?(w.dir<0?'left':'right'):(w.dir<0?'up':'down'),w.step)});}
    if(S.ch===2&&S.day>=3){for(const [tx,ty] of [[31,25],[34,25]])list.push({y:ty*TS+15,f:()=>drawTent(tx*TS-cx,ty*TS-cy)});list.push({y:26*TS+10,f:()=>drawFire(32*TS+8-cx,26*TS+12-cy,t)});}
    if(KID.on)list.push({y:KID.y,f:()=>drawPerson(ctx,KID.x-cx,KID.y-cy,kidLook(),'down',KID.moving?1:0)});
    list.push({y:player.y,f:()=>drawPerson(ctx,player.x-cx,player.y-cy,playerLook(),player.dir,player.step,{sword:S.items.includes('sword'),bread:!!S.flags.bread})});
  }else{
    for(const w of wanderers){list.push({y:w.y,f:()=>drawPerson(ctx,w.x-cx,w.y-cy,w.L,w.ax==='x'?(w.dir<0?'left':'right'):(w.dir<0?'up':'down'),w.step)});}
    for(const n of npcs.slice(0,7)){const p=npcPos(n);list.push({y:p.y,f:()=>drawPerson(ctx,p.x-cx,p.y-cy,n.L,n.dir||'down',0)});}
  }
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  /* time-of-day light */
  if(period===0){ctx.fillStyle='rgba(255,226,170,.07)';ctx.fillRect(0,0,VW,VH);}
  if(period>=2){
    ctx.fillStyle='#f2c25c';for(const [wx,wy] of WINDOWS){const sx=wx-cx,sy=wy-cy;if(sx>-8&&sy>-8&&sx<VW&&sy<VH){ctx.fillRect(sx,sy,6,6);ctx.fillStyle='#4a2f1a';ctx.fillRect(sx+2,sy,1,6);ctx.fillRect(sx,sy+2,6,1);ctx.fillStyle='#f2c25c';}}
    if(period===2){ctx.fillStyle='rgba(255,130,60,.12)';ctx.fillRect(0,0,VW,VH);}
    lx.globalCompositeOperation='source-over';lx.clearRect(0,0,VW,VH);
    lx.fillStyle=period===2?'rgba(50,20,50,.32)':'rgba(8,12,38,.68)';lx.fillRect(0,0,VW,VH);
    lx.globalCompositeOperation='destination-out';
    const ls=LIGHTS.slice();if(S)ls.push({x:player.x,y:player.y-6,r:period===3?44:30});if(S&&S.ch===2&&S.day>=3)ls.push({x:32*TS+8,y:26*TS+8,r:44,warm:true});
    for(const L of ls){const sx=L.x-cx,sy=L.y-cy,r=L.r*(L.warm?1+Math.sin(t*7+L.x)*.04:1);if(sx<-r||sy<-r||sx>VW+r||sy>VH+r)continue;const gr=lx.createRadialGradient(sx,sy,0,sx,sy,r);gr.addColorStop(0,'rgba(0,0,0,.95)');gr.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=gr;lx.fillRect(sx-r,sy-r,r*2,r*2);}
    lx.globalCompositeOperation='source-over';ctx.drawImage(lc,0,0);
    ctx.globalCompositeOperation='lighter';
    for(const L of LIGHTS){if(!L.warm)continue;const sx=L.x-cx,sy=L.y-cy;if(sx<-30||sy<-30||sx>VW+30||sy>VH+30)continue;const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,18);gr.addColorStop(0,'rgba(255,170,70,.22)');gr.addColorStop(1,'rgba(255,170,70,0)');ctx.fillStyle=gr;ctx.fillRect(sx-18,sy-18,36,36);}
    ctx.globalCompositeOperation='source-over';
  }
  if(S&&S.flags.letters){for(const id of S.flags.letters.left){const d=LETTER_DOORS.find(q=>q.id===id);if(!d)continue;const bx=d.tx*TS+8-cx,by=d.ty*TS-6-cy+Math.round(Math.sin(t*4)*1.5);ctx.fillStyle='#2a1f17';ctx.fillRect(bx-6,by-5,12,9);ctx.fillStyle='#f2c25c';ctx.fillRect(bx-5,by-4,10,7);ctx.fillStyle='#b8862a';ctx.fillRect(bx-5,by-4,1,1);ctx.fillRect(bx-4,by-3,1,1);ctx.fillRect(bx-3,by-2,1,1);ctx.fillRect(bx+4,by-4,1,1);ctx.fillRect(bx+3,by-3,1,1);ctx.fillRect(bx+2,by-2,1,1);ctx.fillStyle='#9c3b28';ctx.fillRect(bx-1,by-1,2,2);}}
  /* floaters */
  ctx.font='600 8px "Pixelify Sans", monospace';ctx.textAlign='center';
  for(const f of floaters){const a=Math.max(0,1-f.t/1.6);ctx.fillStyle=`rgba(29,24,20,${a*.8})`;const tx=Math.round(f.x-cx),ty=Math.round(f.y-cy-f.t*14);const w=ctx.measureText(f.text).width+6;ctx.fillRect(tx-w/2,ty-8,w,11);ctx.fillStyle=`rgba(242,194,92,${a})`;ctx.fillText(f.text,tx,ty);}
  updatePrompt();
}
function updatePrompt(){
  const pr=$('#prompt');
  if(target&&mode==='play'&&!busy){const html=`<b>${KEY}</b> · ${target.label}`;if(pr.innerHTML!==html)pr.innerHTML=html;pr.hidden=false;}else pr.hidden=true;
}

/* ---------- LOOP ---------- */
let last=performance.now(),hudT=0,saveT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(D.typing){D.shown+=dt*55;D.txt.textContent=D.full.slice(0,Math.floor(D.shown));if(D.shown>=D.full.length)dShowChoices();}
  if(C3.active()){if(C3.isTown()){update(dt);updatePrompt();}}
  else{update(dt);render(now,dt);}
  hudT+=dt;if(hudT>.5&&S){hudT=0;if(S.flags.bread||S.flags.letters||(S.race&&S.race.on))$('#objTxt').textContent=objective();}
  saveT+=dt;if(saveT>5){saveT=0;if(mode==='play')save();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
titleScreen();
})();
