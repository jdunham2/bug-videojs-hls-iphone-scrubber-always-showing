// --------------------------------------------------------------- audio
let AC = null, master, sfxG, musG, noiseBuf, musicOn = true;
let musStep = 0, musNext = 0, musIntensity = 0;
const BPM = 136, STEP = 60 / BPM / 4;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
  const comp = AC.createDynamicsCompressor(); comp.connect(master);
  sfxG = AC.createGain(); sfxG.gain.value = 0.9; sfxG.connect(comp);
  musG = AC.createGain(); musG.gain.value = 0.3; musG.connect(comp);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  musNext = AC.currentTime + 0.1; setInterval(schedMusic, 25);
}
function tone(f, dur, type = 'square', vol = 0.2, f2 = null, t0 = 0, dest = sfxG) {
  if (!AC) return; const t = AC.currentTime + Math.max(0, t0);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1500, ft = 'lowpass', f2 = null, t0 = 0, dest = sfxG) {
  if (!AC) return; const t = AC.currentTime + Math.max(0, t0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = ft; fl.frequency.setValueAtTime(freq, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const SFX = {
  light() { noise(0.07, 0.5, 2600, 'lowpass', 600); tone(190, 0.09, 'sine', 0.45, 60); },
  heavy() { noise(0.2, 0.7, 1800, 'lowpass', 200); tone(110, 0.25, 'sine', 0.75, 35); tone(70, 0.3, 'triangle', 0.4, 30); },

  charge() { tone(200, 0.35, 'sawtooth', 0.08, 800); },
  portal() { tone(120, 0.45, 'sine', 0.12, 480); },
  banner() { tone(98, 0.5, 'sawtooth', 0.14, 98); noise(0.35, 0.3, 900, 'lowpass', 200); },

  menu() { tone(720, 0.06, 'square', 0.06); },

  revive() { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, null, i * 0.07)); },
  throw_() { noise(0.1, 0.12, 1000, 'bandpass', 3000); },

  roar() { tone(90, 0.9, 'sawtooth', 0.22, 55); tone(95, 0.9, 'square', 0.08, 60); noise(0.9, 0.3, 600, 'bandpass', 200); },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PROG = [[45, 0], [41, 1], [48, 1], [43, 1]];
function schedMusic() {
  if (!AC) return;
  if (musNext < AC.currentTime) musNext = AC.currentTime + 0.05;
  while (musNext < AC.currentTime + 0.12) {
    const t = musNext - AC.currentTime, s = musStep % 16, bar = Math.floor(musStep / 16) % 4;
    const [root, maj] = PROG[bar];
    if (musicOn && G.state !== 'pause') {
      const I = musIntensity;
      if (s % 4 === 0) tone(150, 0.18, 'sine', 0.7, 40, t, musG);
      if (I >= 1 && (s === 4 || s === 12)) { noise(0.12, 0.35, 3000, 'highpass', 1000, t, musG); tone(200, 0.08, 'triangle', 0.15, 120, t, musG); }
      if (I >= 1 && (s % 2 === 0 || I >= 2)) noise(0.03, s % 4 === 2 ? 0.08 : 0.04, 8000, 'highpass', null, t, musG);
      if ([0, 3, 6, 8, 10, 11, 14].includes(s)) tone(mtof(root + (s === 8 || s === 14 ? 12 : 0)), STEP * 1.6, 'sawtooth', 0.11, null, t, musG);
      if (I >= 1) {
        const ch = [0, maj ? 4 : 3, 7, 12], n = root + 24 + ch[(s * 3 + bar) % 4];
        if (s % 2 === 1 || I >= 2) tone(mtof(n), STEP * 0.9, 'square', 0.03, null, t, musG);
      }
      if (I >= 2 && s % 8 === 0) tone(mtof(root + 36 + (bar % 2 ? 7 : 3)), STEP * 3, 'sawtooth', 0.03, null, t, musG);
    }
    musNext += STEP; musStep++;
  }
}

  keys.add(e.code); initAudio();
});

addEventListener('blur', () => keys.clear());

const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'light', 'heavy', 'dash', 'special', 'start', 'back'];
class Ctrl {
  constructor() { this.cur = {}; this.prev = {}; this.buf = {}; }
  feed(st) {
    this.prev = this.cur; this.cur = st;
    for (const a of ACTIONS) { if (this.cur[a] && !this.prev[a]) this.buf[a] = 9; else if (this.buf[a] > 0) this.buf[a]--; }
  }
  down(a) { return !!this.cur[a]; }
  pressed(a) { return !!this.cur[a] && !this.prev[a]; }
  take(a) { if (this.buf[a] > 0) { this.buf[a] = 0; return true; } return false; }
  anyFace() { return ['jump', 'light', 'heavy', 'special', 'start'].some(a => this.pressed(a)); }
}
const ctrls = [new Ctrl(), new Ctrl()];
function getPads() { return navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(p => p && p.connected) : []; }
function padFor(idx) { const p = getPads(); return idx === 1 ? (p[0] || null) : (p[1] || null); }
function readPad(gp) {
  if (!gp) return {};
  const b = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, dz = 0.4;
  // Standard mapping by position. On a Switch Pro: 0=B(bottom) 1=A(right) 2=Y(left) 3=X(top)
  return { left: b(14) || ax < -dz, right: b(15) || ax > dz, up: b(12) || ay < -0.6, down: b(13) || ay > 0.6,
    jump: b(0), special: b(1), light: b(2), heavy: b(3), dash: b(4) || b(5) || b(6) || b(7), start: b(9), back: b(8) };
}
function readKeys() {
  const k = c => keys.has(c);
  return { left: k('KeyA') || k('ArrowLeft'), right: k('KeyD') || k('ArrowRight'), up: k('KeyW') || k('ArrowUp'), down: k('KeyS') || k('ArrowDown'),
    jump: k('Space'), light: k('KeyJ'), heavy: k('KeyK'), dash: k('KeyL') || k('ShiftLeft') || k('ShiftRight'), special: k('KeyI'),
    start: k('Enter'), back: false };
}
function pollInput() {
  const kb = readKeys(), p1pad = readPad(padFor(0)), m = {};
  for (const a of ACTIONS) m[a] = kb[a] || p1pad[a];
  ctrls[0].feed(m);
  ctrls[1].feed(readPad(padFor(1)));
}
function rumble(pi, strong, weak, dur) {
  const gp = padFor(pi); if (!gp) return;
  try { if (gp.vibrationActuator) gp.vibrationActuator.playEffect('dual-rumble', { duration: dur, strongMagnitude: strong, weakMagnitude: weak }); } catch (e) { }
}

  txt('ESC / −  —  TITLE', W / 2, 780, 28, '#ccc', 'center', F1);
}
function render(now) {
  boil = Math.floor(now / 110) % 4;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0d0d10'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (G.state === 'title') drawTitle(now);
  else { drawWorld(); drawHUD(); if (G.state === 'pause') drawPause(); if (G.state === 'over') drawOver(); }
  ctx.restore();
}

// ---------------------------------------------------------------- boot
G.players = [new Player(0), new Player(1)];
G.stage = 0; buildBG();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildBG());
addEventListener('gamepadconnected', () => { SFX.menu(); });
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt * (G.state === 'play' ? timeScale : 1);
  let n = 0;
  while (acc >= 1 / 60 && n < 5) { step(); acc -= 1 / 60; n++; }
  if (n >= 5) acc = 0;
  render(now);
}
requestAnimationFrame(loop);
window.__G = G; // debug hook
</script>
