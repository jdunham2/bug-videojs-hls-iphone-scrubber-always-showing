<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stick Squad: Ink Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0d10;overflow:hidden}
  canvas{display:block}
  #net{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,14,0.72);font-family:"Patrick Hand","Comic Sans MS",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #net[hidden],#net [hidden]{display:none!important}
  #net .box{background:#f4f0e3;color:#24242a;border:4px solid #24242a;box-shadow:8px 8px 0 #24242a;padding:24px 28px;max-width:520px;width:100%;transform:rotate(-0.6deg)}
  #net h2{font-family:"Permanent Marker",Impact,sans-serif;font-size:40px;margin:0 0 8px;color:#e2342c}
  #net p{font-size:20px;line-height:1.35;margin:8px 0}
  #net .row{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
  #net button{font-family:"Permanent Marker",Impact,sans-serif;font-size:20px;padding:10px 18px;border:3px solid #24242a;background:#fff;color:#24242a;cursor:pointer;box-shadow:3px 3px 0 #24242a}
  #net button.primary{background:#e2342c;color:#fff}
  #net button:focus-visible,#net input:focus-visible{outline:3px solid #2a6ae6;outline-offset:2px}
  #net input{font-family:"Permanent Marker",Impact,sans-serif;font-size:28px;width:140px;letter-spacing:6px;text-transform:uppercase;padding:6px 10px;border:3px solid #24242a;background:#fff;color:#24242a}
  #netStatus{font-weight:bold;color:#2a6ae6;min-height:1.3em}
  #netCode{font-family:"Permanent Marker",Impact,sans-serif;font-size:56px;letter-spacing:10px;color:#24242a;margin:6px 0}
</style>
</head>

<canvas id="c"></canvas>

    <p id="netInfo"></p>
    <div id="netWorld" class="row" hidden><button id="bRejoin" class="primary">Rejoin world</button></div>

    <div id="netJoin" hidden><div class="row"><input id="netCodeIn" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code"><button id="bGo" class="primary">Join</button></div><div id="netList" class="row"></div></div>
    <div id="netCode" hidden></div>
    <p id="netStatus" aria-live="polite"></p>
    <div class="row"><button id="bLeave" hidden>Leave online game</button><button id="bClose">Close</button></div>

  scale = Math.min(canvas.width / W, canvas.height / H);

}

// ---------------------------------------------------------- particles
const stain = document.createElement('canvas'); stain.width = W; stain.height = H;
const sctx = stain.getContext('2d');
function stampSplat(x, y, r, col) {
  sctx.save(); sctx.globalAlpha = 0.55; sctx.fillStyle = col;
  sctx.beginPath(); sctx.ellipse(x, y, r * 1.3, r * 0.45, 0, 0, Math.PI * 2); sctx.fill();
  for (let i = 0; i < 5; i++) { const a = rand(0, Math.PI * 2), d = rand(r * 0.8, r * 2); sctx.beginPath(); sctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.3, rand(1.5, r * 0.3), 0, Math.PI * 2); sctx.fill(); }
  sctx.restore();
}
function splash(x, y, col, n, spd, dirX) {
  for (let i = 0; i < n; i++) {
    const a = dirX ? (dirX > 0 ? 0 : Math.PI) + rand(-1.1, 1.1) - 0.35 * dirX * 0 : rand(0, Math.PI * 2);
    const s = rand(spd * 0.4, spd * 1.2);
    parts.push({ type: 'ink', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - rand(1, 4), r: rand(2, 5.5), col, life: rand(40, 80) });
  }
}
function sparks(x, y, dir, n, col = '#fff6c0') {
  for (let i = 0; i < n; i++) { const a = (dir > 0 ? 0 : Math.PI) + rand(-0.9, 0.9), s = rand(7, 16); parts.push({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(8, 14), max: 14, col }); }
}
function ring(x, y, col, r2 = 80, lw = 6, life = 18) { parts.push({ type: 'ring', x, y, r: 6, r2, col, lw, life, max: life }); }
function dustBurst(x, y, n) { for (let i = 0; i < n; i++) parts.push({ type: 'dust', x: x + rand(-14, 14), y: y - rand(0, 8), vx: rand(-3, 3), vy: rand(-1.5, -0.2), r: rand(4, 9), life: rand(20, 35), max: 35 }); }
function floatText(x, y, txt, col, size = 30, life = 50) { x = clamp(x, txt.length * size * 0.3 + 10, W - txt.length * size * 0.3 - 10); texts.push({ x, y, txt, col, size, life, max: life, vy: -1.6 }); }
function updateParts() {
  for (const p of parts) {
    p.life--;
    if (p.type === 'ink') {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.vx *= 0.98;
      if (p.y >= FLOOR) { stampSplat(p.x, FLOOR + rand(-1, 4), p.r, p.col); p.life = 0; }
    } else if (p.type === 'spark') { p.x += p.vx; p.y += p.vy; p.vx *= 0.85; p.vy *= 0.85; }
    else if (p.type === 'ring') { p.r = lerp(p.r, p.r2, 0.22); }
    else if (p.type === 'flame') { p.x += p.vx; p.y += p.vy; p.r *= 0.96; }
    else if (p.type === 'dust') { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.r += 0.35; }
  }
  parts = parts.filter(p => p.life > 0 && p.x > -100 && p.x < W + 100);
  if (parts.length > 700) parts.splice(0, parts.length - 700);
  for (const t of texts) { t.life--; t.y += t.vy; t.vy *= 0.95; }
  texts = texts.filter(t => t.life > 0);
  for (const g of G.ghosts) g.life--;
  G.ghosts = G.ghosts.filter(g => g.life > 0);
}

let uid = 0;
class Fighter {
  constructor(x, y, s) {
    this.id = ++uid; this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.s = s; this.facing = 1; this.onGround = false;
    this.hp = this.maxHp = 100; this.attack = null; this.at = 0; this.hitSet = new Set(); this.hitstop = 0; this.flash = 0; this.inv = 0;
    this.stun = 0; this.dropT = 0; this.pose = mk({}); this.anim = 0; this.spin = 0; this.dead = false; this.armor = false; this.juggle = 0; this.scarf = [];
  }
  get hw() { return 16 * this.s; }
  get hh() { return 78 * this.s; }
  hurtbox() { return { x: this.x - this.hw, y: this.y - this.hh, w: this.hw * 2, h: this.hh }; }
  physics(o = {}) {
    if (this.onGround && this.plat && this.plat.move && this.dropT <= 0) { this.x += this.plat.ddx || 0; this.y = this.plat.y; }
    if (!o.noGrav) this.vy = Math.min(this.vy + GRAV * (o.gMul || 1) * (this.char && this.char.lowgrav ? 0.62 : 1) * (isLowGrav() ? 0.55 : isWater() ? 0.5 : 1), o.maxFall || (isWater() ? 8 : 17));
    this.x += this.vx;
    const m = this.hw + 6;
    if (this.x < m || this.x > W - m) {
      this.x = clamp(this.x, m, W - m);
      if (this.stun > 0 && Math.abs(this.vx) > 9) { // wall splat
        this.vx = -this.vx * 0.45; splash(this.x, this.y - this.hh * 0.6, this.inkCol(), 8, 5); addShake(4); SFX.land();
        const lh = this.lastHitBy;
        if (!(this instanceof Player) && !this.dead && lh && lh.char && lh.char.homerun) {
          this.hp -= 10; floatText(this.x, this.y - this.hh - 20, 'SPLAT! 10', '#e8a800', 26, 40);
          if (this.hp <= 0) killEnemy(this, lh, sign(this.vx));
        }
      } else this.vx = 0;
      this.hitWall = true;
    } else this.hitWall = false;
    const py = this.y; this.y += this.vy;
    const was = this.onGround; this.onGround = false;
    if (this.vy >= 0) {
      if (this.y >= FLOOR && !(this instanceof Player && overPit(this))) { this.y = FLOOR; this.onGround = true; this.plat = null; }
      else if (this.dropT <= 0) {
        for (const p of layout()) if (!p.gone && py <= p.y + Math.abs(p.ddy || 0) + 0.01 && this.y >= p.y && this.x >= p.x - 4 && this.x <= p.x + p.w + 4) { this.y = p.y; this.onGround = true; this.plat = p; break; }
      }
    }
    if (this.onGround) { const v = this.vy; this.vy = 0; this.juggle = 0; if (!was) this.onLand(v); }
    if (this instanceof Player && this.y > H + 60) {
      this.x = this.x < W / 2 ? 190 : 1410; this.y = 120; this.vy = 0; this.vx = 0; this.stun = 0;
      ring(this.x, this.y, this.col, 80, 5, 16); floatText(this.x, this.y + 40, 'FELL! -12', '#d22', 26, 40);
      if (!this.downed) { this.hp -= 12; this.flash = 8; this.inv = Math.max(this.inv, 60); SFX.hurt(); if (this.hp <= 0) playerDown(this); }
    }
    if (this.onGround && this.plat && this.plat.bounce && !(this.T && this.T.boss) && !this.downed) {
      this.vy = -21; this.onGround = false; if (this instanceof Player) { this.jumps = 1; this.coyote = 0; }
      tone(300, 0.15, 'triangle', 0.1, 700); dustBurst(this.x, this.y, 4);
    }
  }
  onLand(v) {
    if (this.stun > 0 && v > 9) { this.vy = -v * 0.38; this.onGround = false; dustBurst(this.x, this.y, 8); SFX.land(); addShake(2); }
    else if (v > 6) dustBurst(this.x, this.y, 5);
  }
  inkCol() { return this.col || theme().enemy; }
  onPlatform() { return this.onGround && this.y < FLOOR; }
}

function atkBox(f, a, sword) {
  const hb = a.hb, s = f.s, k = sword ? 1.35 : 1;

}
