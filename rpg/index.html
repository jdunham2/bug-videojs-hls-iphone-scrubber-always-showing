<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Emberfall Chronicles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed canvas world, HUD painted on canvas, DOM overlays for menus, dialogue and touch controls. Single dark fantasy look. */
:root{
  --ink:#0d111d; --panel:#141a2c; --panel2:#1c2440; --line:#36426b; --line2:#4b5a8f;
  --gold:#f0b94a; --ember:#ff7a3d; --text:#eaedf6; --muted:#9ba4c2; --good:#6fdc8c; --bad:#ff6b6b; --mana:#5aa8ff;
  --display:'Cinzel Decorative', 'Palatino Linotype', Georgia, serif;
  --ui:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
[hidden]{display:none!important}
button{font-family:var(--ui);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* menu buttons */
#menu{position:fixed;z-index:5;display:flex;gap:6px;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 96px)}
#menu button{background:rgba(20,26,44,.82);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
#menu button:hover{border-color:var(--gold);color:var(--gold)}
#menu kbd{font-family:var(--ui);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:640px){#menu{flex-direction:column;align-items:flex-start}#menu kbd{display:none}#menu button{padding:5px 9px;font-size:12px}}

/* overlay panels */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,6,14,.6);backdrop-filter:blur(3px);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.panel{position:relative;width:min(780px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,var(--panel2),var(--panel) 40%);border:1px solid var(--line2);border-radius:16px;box-shadow:inset 0 1px 0 rgba(240,185,74,.25),0 30px 90px rgba(0,0,0,.65);padding:22px 22px 20px;animation:pop .18s ease-out}
.panel.narrow{width:min(520px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.panel h2{font-family:var(--display);font-weight:900;font-size:24px;margin:0 0 4px;color:var(--gold);text-wrap:balance;letter-spacing:.02em}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:18px 0 8px;font-weight:800}
.panel p{line-height:1.5;margin:6px 0;max-width:65ch}
.sub{color:var(--muted);font-size:14px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--gold);border-color:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.tab.on{background:var(--gold);color:#241a05;border-color:var(--gold)}
.btn{background:linear-gradient(180deg,#f6c968,#d99a2b);color:#2a1c04;border:0;border-radius:10px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:0 2px 0 #8a5e12}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:#2a3150;color:#6c7598;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px}
@media (max-width:640px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(75,90,143,.35);font-variant-numeric:tabular-nums}
.stat b{color:var(--text)} .stat span{color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;max-width:100%;background:rgba(10,14,28,.55);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
.slot img{width:70%;height:70%;image-rendering:auto}
.slot .n{position:absolute;right:5px;bottom:3px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.slot.use{border-color:var(--gold)} .slot.use:hover{background:rgba(240,185,74,.12)}
.slot.empty{opacity:.35}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(10,14,28,.45)}
.item img{width:44px;height:44px}
.item .nm{font-weight:800}
.item .ds{color:var(--muted);font-size:13px;line-height:1.35}
.req{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px 2px 3px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip img{width:18px;height:18px}
.chip.ok{color:var(--good)} .chip.no{color:var(--bad)}
.q{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(10,14,28,.45);margin-bottom:8px}
.q .nm{font-weight:800;font-size:16px} .q .pg{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.q.done{opacity:.55}
.bar{height:6px;background:#0b0f1d;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ember))}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ach div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.ach div.on{border-color:var(--gold);background:rgba(240,185,74,.08)}
.ach div b{display:block;color:var(--gold)} .ach div:not(.on) b{color:var(--muted)}
.beast{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.beast div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(10,14,28,.45);font-size:12.5px;color:var(--muted)}
.beast img{width:84px;height:84px}
.beast b{color:var(--text);font-size:14.5px}
.beast em{font-style:normal;color:var(--gold);font-weight:800;margin-top:2px}
.beast .unk b{color:var(--muted)}
.speaker{display:flex;gap:14px;align-items:center}
.speaker canvas{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2d3a66,#121831);border:2px solid var(--gold);flex:none}
.say{font-size:17px;line-height:1.5;margin:14px 0;padding:14px 16px;border-left:3px solid var(--gold);background:rgba(240,185,74,.06);border-radius:0 10px 10px 0}
.reward{color:var(--gold);font-weight:800}
#mapc{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#0a0e1a;display:block}
kbd.k{font-family:var(--ui);font-weight:800;font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);background:#0e1324}
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px;font-size:14px}
.help div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(75,90,143,.3);padding:5px 0}

/* title screen */
#title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(13,17,29,.25),rgba(13,17,29,.85) 75%);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(40px,9vw,96px);line-height:.95;margin:0;letter-spacing:.03em;background:linear-gradient(180deg,#fff1c9 10%,#f0b94a 50%,#c2561d 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(60,20,5,.85)) drop-shadow(0 0 28px rgba(255,122,61,.45))}
.logo small{display:block;font-size:.32em;letter-spacing:.42em;margin-top:.35em}
.tag{font-size:clamp(15px,2.2vw,19px);color:#d7dcef;max-width:52ch;margin:0;text-shadow:0 2px 6px #000}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(820px,100%)}
@media (max-width:640px){.classes{grid-template-columns:minmax(0,1fr)}}
.cls{background:linear-gradient(180deg,rgba(28,36,64,.92),rgba(16,21,38,.94));border:1px solid var(--line2);border-radius:16px;padding:14px 14px 16px;color:var(--text);text-align:left;display:flex;gap:12px;align-items:center;transition:transform .15s,border-color .15s}
.cls:hover,.cls:focus-visible{transform:translateY(-3px);border-color:var(--gold)}
.cls canvas{width:76px;height:88px;flex:none}
.cls b{font-family:var(--display);font-size:19px;color:var(--gold);display:block}
.cls span{font-size:13.5px;color:var(--muted);line-height:1.35;display:block;margin-top:3px}
.cls em{font-style:normal;font-size:12px;color:var(--ember);font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:6px}
.hint{font-size:13px;color:var(--muted)}

/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#touch .pad{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:210px;height:200px;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(240,185,74,.55);background:radial-gradient(circle at 40% 30%,rgba(60,72,120,.85),rgba(18,24,44,.9));color:var(--text);font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#touch button:active{transform:scale(.93);border-color:var(--gold)}
#tAtk{width:84px;height:84px;right:0;bottom:0;font-size:14px!important}
#tSkill{width:60px;height:60px;right:92px;bottom:2px}
#tDash{width:56px;height:56px;right:6px;bottom:96px}
#tUse{width:56px;height:56px;right:76px;bottom:72px}
#tPot{width:50px;height:50px;right:146px;bottom:78px}
#tMp{width:44px;height:44px;right:150px;bottom:136px}
#touch small{font-size:10px;color:var(--gold)}
#touch .pad{height:260px}
#touch .sp{width:52px;height:52px;bottom:200px;border-color:rgba(180,140,255,.7);font-size:10.5px}
#tS0{right:0}#tS1{right:60px}#tS2{right:120px}

#dead h2{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.cls{transition:none}}
</style>

<canvas id="game" tabindex="0" aria-label="Emberfall Chronicles game world"></canvas>
<div id="probe"></div>
<div id="menu" hidden>
  <button data-m="bag" title="Character and bag">Bag <kbd>I</kbd></button>
  <button data-m="quests" title="Quest log">Quests <kbd>L</kbd></button>
  <button data-m="spells" title="Spellbook">Spells <kbd>B</kbd></button>
  <button data-m="map" title="World map">Map <kbd>M</kbd></button>
  <button data-m="sound" id="sndBtn" title="Sound on or off">Sound</button>
  <button data-m="help" title="Controls">Help <kbd>H</kbd></button>
</div>
<div id="touch" hidden>
  <div class="pad">
    <button id="tAtk" data-t="atk">Attack</button>
    <button id="tSkill" data-t="skill">Skill</button>
    <button id="tDash" data-t="dash">Dash</button>
    <button id="tUse" data-t="use">Use</button>
    <button id="tPot" data-t="pot">HP<small id="tPotN">0</small></button>
    <button id="tMp" data-t="mp">MP<small id="tMpN">0</small></button>
    <button id="tS0" class="sp" data-t="s0">—</button><button id="tS1" class="sp" data-t="s1">—</button><button id="tS2" class="sp" data-t="s2">—</button>
  </div>
</div>
<div id="overlay" hidden></div>
<div id="title">
  <h1 class="logo">Emberfall<small>Chronicles</small></h1>
  <p class="tag">The Hollow King stirs in the ruins and the Ashen Wyrm beneath the wastes. Fight, fish, mine, forge and explore eight regions to save Emberfall.</p>
  <div id="cont" class="row" style="justify-content:center"></div>
  <div class="classes" id="classes"></div>
  <p class="hint">WASD to move · Space or click to attack · F skill · Shift dash · E interact · works with touch too</p>
</div>

<script>
'use strict';
/* =========================================================
   EMBERFALL CHRONICLES — a procedurally drawn action RPG
   ========================================================= */
const T=40, W=112, H=84, CH=16, SEED=4271;
const VX=56, VY=40, LX=26, LY=52, BX=100, BY=72, HX=42, HY=68;
const DEEP=0,WATER=1,SAND=2,LAVA=3,ASH=4,STONE=5,PATH=6,GRASS=7,FOREST=8,FLOOR=9;
const COL=['#184467','#2a78ad','#dec389','#ff5a1c','#4a3f3d','#7e8680','#b8956a','#5ba746','#3b7a37','#a49d94'];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+1));
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b), pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return Math.abs(d)};
function shade(hex,amt){let c=parseInt(hex.slice(1),16),r=c>>16,g=c>>8&255,b=c&255;if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}return`rgb(${r|0},${g|0},${b|0})`}
function rgba(hex,a){let c=parseInt(hex.slice(1),16);return`rgba(${c>>16},${c>>8&255},${c&255},${a})`}

/* ---------- noise ---------- */
function hash(x,y,s=0){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(SEED+s*977,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s=0){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s=0){let t=0,a=.5,f=1;for(let i=0;i<4;i++){t+=a*vnoise(x*f,y*f,s+i);f*=2;a*=.5}return t/.9375}
function srng(seed){let s=(Math.floor(seed*2147483646)|0)+1;return()=>{s=(s*16807)%2147483647;return s/2147483647}}

/* ---------- regions ---------- */
const REGIONS={
  village:{name:'Emberfall Village',lv:'Safe haven'},
  meadow:{name:'Sunlit Meadows',lv:'Danger: Lv 1-3'},
  coast:{name:'Saltwind Coast',lv:'Danger: Lv 1-3'},
  lake:{name:'Mirror Lake',lv:'Danger: Lv 2-4'},
  forest:{name:'Whisperwood',lv:'Danger: Lv 3-6'},
  ruins:{name:'Sunken Ruins',lv:'Danger: Lv 5-8'},
  hills:{name:'Ironcrag Hills',lv:'Danger: Lv 6-9'},
  ash:{name:'Ashen Wastes',lv:'Danger: Lv 9+'}
};
function borderDist(x,y){return Math.min(x,y,W-1-x,H-1-y)+(fbm(x*.12,y*.12,1)-.5)*5}
function regionOf(x,y){
  const n=(fbm(x*.08,y*.08,2)-.5)*8;
  if(dist(x,y,VX+.5,VY+.5)<10.5)return'village';
  if(x+n>80&&y+n>54)return'ash';
  if(dist(x,y,LX,LY)<11.5+n*.6)return'lake';
  if(borderDist(x,y)<7.5)return'coast';
  if(y+n>58)return'ruins';
  if(x+n>74)return'hills';
  if(y+n<28)return'forest';
  return'meadow';
}

/* ---------- world gen ---------- */
const tiles=new Uint8Array(W*H), reg=new Array(W*H), grid=new Array(W*H).fill(null);
const tileAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?DEEP:tiles[y*W+x];
const regAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?'coast':reg[y*W+x];
const objs=[];
function genMap(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x, r=regionOf(x,y); reg[i]=r;
    const bd=borderDist(x,y); let t;
    if(bd<2.5)t=DEEP; else if(bd<3.7)t=WATER; else if(bd<5.3&&r!=='ash')t=SAND;
    else switch(r){
      case'lake':{const d=dist(x,y,LX,LY)+(fbm(x*.15,y*.15,3)-.5)*5;t=d<5?DEEP:d<8.5?WATER:d<10?SAND:GRASS;break}
      case'forest':t=fbm(x*.2,y*.2,4)>.66?GRASS:FOREST;break;
      case'hills':t=fbm(x*.18,y*.18,5)>.62?GRASS:STONE;break;
      case'ruins':t=fbm(x*.2,y*.2,6)>.6?GRASS:STONE;break;
      case'ash':{const n=fbm(x*.16,y*.16,7);t=(n>.64&&dist(x,y,BX,BY)>8.5)?LAVA:ASH;if(bd<3.7)t=bd<2.5?DEEP:LAVA;break}
      case'coast':t=fbm(x*.2,y*.2,8)>.58?SAND:GRASS;break;
      default:t=GRASS;
    }
    tiles[i]=t;
  }
  const road=pts=>{for(let k=0;k<pts.length-1;k++){const[a,b]=[pts[k],pts[k+1]],len=dist(a[0],a[1],b[0],b[1]);
    for(let s=0;s<=len;s+=.25){const f=s/len,ox=(vnoise(s*.12,k*9,9)-.5)*2.2,oy=(vnoise(s*.12,k*9+40,9)-.5)*2.2;
      const x=Math.floor(a[0]+(b[0]-a[0])*f+ox),y=Math.floor(a[1]+(b[1]-a[1])*f+oy);
      for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const tx=x+dx,ty=y+dy;if(tx<4||ty<4||tx>=W-4||ty>=H-4)continue;const t=tiles[ty*W+tx];if(t!==DEEP&&t!==WATER)tiles[ty*W+tx]=PATH}}}};
  road([[VX,VY],[VX,9]]); road([[VX,VY],[101,VY]]); road([[VX,VY],[VX,65],[80,67],[BX,BY]]); road([[VX,VY],[37,VY],[37,47]]); road([[VX,62],[HX+2,HY]]);
  for(let y=VY-4;y<=VY+5;y++)for(let x=VX-4;x<=VX+5;x++)if(dist(x,y,VX+.5,VY+.5)<3.4)tiles[y*W+x]=FLOOR;
  for(let y=BY-7;y<=BY+7;y++)for(let x=BX-7;x<=BX+7;x++)if(dist(x,y,BX,BY)<7.2&&tiles[y*W+x]!==PATH)tiles[y*W+x]=ASH;
  for(let y=HY-7;y<=HY+7;y++)for(let x=HX-7;x<=HX+7;x++)if(dist(x,y,HX,HY)<7.2)tiles[y*W+x]=dist(x,y,HX,HY)<5.5?FLOOR:STONE;
}
function addObj(type,tx,ty,ex={}){
  const o=Object.assign({type,tx,ty,x:(tx+.5)*T,y:(ty+.5)*T,seed:hash(tx,ty,7),solid:true},ex);
  objs.push(o);
  const w=o.w||1,h=o.h||1;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)grid[(ty+j)*W+tx+i]=o;
  return o;
}
const free=(x,y)=>{const t=tileAt(x,y);return t!==DEEP&&t!==WATER&&t!==LAVA&&!grid[y*W+x]};
let chests=[], stations={};
function placeObjects(){
  // village
  const house=(tx,ty,w,h,roof,wall,sign)=>{const o=addObj('house',tx,ty,{w,h,roof,wall,sign});o.x=(tx+w/2)*T;o.y=(ty+h)*T-4;return o};
  house(VX-8,VY-7,5,4,'#7a3b8f','#e3d3b5','elder');
  house(VX+4,VY-7,5,4,'#8f3b2e','#d8c3a0','smith');
  house(VX-8,VY+4,5,4,'#2f7a55','#e5d8bc','herb');
  house(VX+8,VY+6,4,3,'#3a5f99','#dccbab');
  house(VX-11,VY-1,3,3,'#9a6a2a','#e0d2b6');
  const st=addObj('stall',VX+4,VY+4,{w:3,h:2});st.x=(VX+5.5)*T;st.y=(VY+6)*T-6;
  stations.forge=addObj('anvil',VX+6,VY-3);
  stations.cauldron=addObj('cauldron',VX-3,VY+5);
  stations.fire=addObj('campfire',VX-2,VY-2);
  addObj('well',VX+3,VY+2); addObj('board',VX-2,VY+3);
  [[VX-1,VY-5],[VX+2,VY-5],[VX-1,VY+6],[VX+2,VY+6],[VX-5,VY-1],[VX-5,VY+2],[VX+6,VY-1],[VX+6,VY+2]].forEach(([x,y])=>{if(free(x,y))addObj('lamp',x,y)});
  // arena braziers
  for(let k=0;k<8;k++){const a=k/8*Math.PI*2;const x=Math.round(BX+Math.cos(a)*6.5),y=Math.round(BY+Math.sin(a)*6.5);if(free(x,y))addObj('brazier',x,y)}
  for(let k=0;k<8;k++){const a=k/8*Math.PI*2+.2;const x=Math.round(HX+Math.cos(a)*6.4),y=Math.round(HY+Math.sin(a)*6.4);if(free(x,y))addObj(k%2?'pillar':'brazier',x,y,{blue:true})}
  for(let y=4;y<H-4;y++)for(let x=4;x<W-4;x++){
    const t=tileAt(x,y), r=regAt(x,y);
    if(t===DEEP||t===WATER||t===LAVA||t===PATH||t===FLOOR||grid[y*W+x])continue;
    if(dist(x,y,VX+.5,VY+.5)<11||dist(x,y,BX,BY)<8||dist(x,y,HX,HY)<8)continue;
    const h=hash(x,y,3), h2=hash(x,y,4);
    if(r==='meadow'){ if(h<.035)addObj('tree',x,y,{kind:h2<.15?'autumn':'oak'}); else if(h<.046)addObj('herb',x,y,{solid:false}); else if(h<.052)addObj('rock',x,y,{ore:'iron'}); }
    else if(r==='coast'){ if(t===SAND&&h<.03)addObj('tree',x,y,{kind:'palm'}); else if(t===GRASS&&h<.04)addObj('tree',x,y,{kind:'oak'}); else if(h<.048)addObj('herb',x,y,{solid:false}); }
    else if(r==='forest'){ if(fbm(x*.1,y*.1,10)>.4&&h<.3)addObj('tree',x,y,{kind:h2<.5?'pine':h2<.62?'autumn':'oak'}); else if(h<.33)addObj('herb',x,y,{solid:false}); else if(h<.35)addObj('glowcap',x,y,{solid:false}); }
    else if(r==='lake'){ if(t===GRASS&&h<.07)addObj('tree',x,y,{kind:'willow'}); else if(t===GRASS&&h<.09)addObj('herb',x,y,{solid:false}); }
    else if(r==='hills'){ if(t===STONE&&h<.1)addObj('rock',x,y,{ore:(x>88&&h2<.3)?'crystal':h2<.45?'gold':'iron'}); else if(t===GRASS&&h<.06)addObj('tree',x,y,{kind:'pine'}); }
    else if(r==='ruins'){ if(h<.03)addObj('pillar',x,y); else if(h<.045)addObj('ruinwall',x,y); else if(h<.055)addObj('glowcap',x,y,{solid:false}); else if(h<.065&&t===GRASS)addObj('tree',x,y,{kind:'dead'}); else if(h<.07)addObj('rock',x,y,{ore:'iron'}); }
    else if(r==='ash'){ if(h<.025)addObj('rock',x,y,{ore:'crystal',obs:true}); else if(h<.04)addObj('tree',x,y,{kind:'dead'}); }
  }
  // chests: two per region
  ['meadow','coast','lake','forest','ruins','hills','ash'].forEach((r,ri)=>{
    const cands=[];for(let y=5;y<H-5;y++)for(let x=5;x<W-5;x++)if(regAt(x,y)===r&&free(x,y)&&tileAt(x,y)!==PATH&&free(x,y+1))cands.push([x,y]);
    for(let k=0;k<2&&cands.length;k++){const c=cands[Math.floor(hash(ri,k,12)*cands.length)];const o=addObj('chest',c[0],c[1],{id:chests.length,lv:ri+1});chests.push(o)}
  });
}

function drawHumanoid(g,x,y,o){

  g.fillStyle=o.trim||'#ddd';g.fillRect(-9,0,18,2.5);if(!up){g.fillRect(-1,-12,2,12)}
  const sw=mv?Math.sin(t*9)*3:0,ag=o.attack||0;
  circ(g,-10,-2+sw,3.6,o.skin||'#f1c9a5');circ(g,10,-2-sw-ag*6,3.6,o.skin||'#f1c9a5');
  if(o.cape&&up){g.fillStyle=o.cape;g.beginPath();const fl=Math.sin(time*5+t*3)*2;g.moveTo(-9,-12);g.lineTo(9,-12);g.lineTo(11+fl,9);g.lineTo(-11+fl,9);g.closePath();g.fill()}

  if(!up){const ex=fx*3.5,ey=-19+fy*1.2;g.fillStyle='#1d1626';
    if(side){rr(g,ex+fx*2-1.3,ey-2,2.6,4,1.3)}else{rr(g,ex-4.5,ey-2,2.6,4,1.3);rr(g,ex+2,ey-2,2.6,4,1.3)}
    g.fillStyle='rgba(255,120,120,.35)';if(!side){circ(g,ex-6,ey+3,2);circ(g,ex+6,ey+3,2)}

function drawWeapon(g,o){
  const w=o.weapon,col=o.wcol||BLADE[o.tier||0],ag=o.attack||0,fx=o.fx||0;
  g.save();const flip=fx<-.3?-1:1;g.translate(10*flip,-4);g.scale(flip,1);

  else if(w==='spear'){g.rotate(-.15);g.translate(0,-ag*14);g.fillStyle='#7a5530';g.fillRect(-1.6,-44,3.2,52);g.fillStyle=col;g.beginPath();g.moveTo(0,-58);g.lineTo(4.5,-46);g.lineTo(0,-42);g.lineTo(-4.5,-46);g.closePath();g.fill();g.fillStyle='#c0392b';g.fillRect(-3,-43,6,3)}

  else if(w==='maul'){g.rotate(-.5+ag*2.4);g.fillStyle='#5a3a20';g.fillRect(-2,-30,4,36);rr(g,-10,-40,20,13,3,'#6c727a');g.fillStyle=col;g.fillRect(-10,-35,20,3);glow(g,0,-34,14,col,.35)}
  else if(w==='wand'){g.rotate(-.35-ag*.6);g.fillStyle='#4a2f1a';g.fillRect(-1.3,-18,2.6,22);glow(g,0,-21,13+Math.sin(time*8)*2,col,.65);g.fillStyle='#fff8c0';g.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2,rr2=i%2?2:5;g.lineTo(Math.cos(a)*rr2,-21+Math.sin(a)*rr2)}g.fill()}

  else if(w==='boomerang'){g.rotate(-.4+ag*2);g.strokeStyle=col;g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(-8,-6);g.lineTo(0,-18);g.lineTo(8,-6);g.stroke()}
  else if(w==='hammer'){g.rotate(-.4);g.fillStyle='#6e4a2a';g.fillRect(-1.5,-18,3,22);rr(g,-6,-24,12,8,2,'#6c727a')}

const SAVE_KEY='emberfall_save_v1';
function packBits(a){let s='';for(let i=0;i<a.length;i+=8){let b=0;for(let j=0;j<8;j++)if(a[i+j])b|=1<<j;s+=String.fromCharCode(b)}return btoa(s)}
function unpackBits(str,a){const s=atob(str);for(let i=0;i<s.length;i++){const b=s.charCodeAt(i);for(let j=0;j<8;j++)if(i*8+j<a.length)a[i*8+j]=(b>>j)&1}}
function serialize(){if(!P)return null;const p=Object.assign({},P);p.opened=chests.filter(c=>c.open).map(c=>c.id);return{v:1,P:p,ex:packBits(explored)}}
function save(){const d=serialize();if(!d)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(d))}catch(e){}}
function loadData(d){
  const base=newPlayer(d.P.cls);P=Object.assign(base,d.P);P.sk=Object.assign(base.sk,d.P.sk||{});
  P.atkCd=P.skillCd=P.dashCd=P.dashT=P.iT=0;P.fish=null;P.gather=null;P.spCd={};if(!WEAPONS[P.weapon])P.weapon=STARTER[P.cls];
  explored.fill(0);try{unpackBits(d.ex,explored)}catch(e){}resetFog();
  chests.forEach(c=>c.open=(P.opened||[]).includes(c.id));
  if(P.own.pet)pet={x:P.x-20,y:P.y,cd:0,anim:0,fx:1};
}

function qEvent(type,t){QUESTS.forEach(q=>{const s=P.q[q.id];if(s&&s.s==='active'&&q.type===type&&(!q.t||q.t===t)){s.c=(s.c||0)+1;if(s.c===q.n)toast('Objective complete: '+q.name,'Return to '+npcName(q.npc),'#6fdc8c')}})}
function npcName(id){const n=npcs.find(n=>n.id===id);return n?n.name:id}
function nextQuest(id){return QUESTS.find(q=>q.npc===id&&(!P.q[q.id]||P.q[q.id].s!=='done'))}
function activeQuests(){return QUESTS.filter(q=>P.q[q.id]&&P.q[q.id].s==='active')}

/* ---------- spawn & enemies ---------- */
function walkable(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);const t=tileAt(tx,ty);if(t===DEEP||t===WATER||t===LAVA)return false;const o=grid[ty*W+tx];return!(o&&o.solid&&!o.stump&&!o.gone)}

}
let spawnT=0;
function spawner(dt){
  spawnT-=dt;if(spawnT>0)return;spawnT=.9;
  const near=enemies.filter(e=>!e.boss&&dist(e.x,e.y,P.x,P.y)<1100).length;
  if(near>=11)return;
  for(let tries=0;tries<8;tries++){
    const a=rnd(0,Math.PI*2),d=rnd(560,900),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<4||ty<4||tx>=W-4||ty>=H-4)continue;
    const r=regAt(tx,ty);if(r==='village'||!walkable(x,y)||dist(tx,ty,BX,BY)<9||dist(tx,ty,HX,HY)<9||dist(tx,ty,VX,VY)<13)continue;
    let tab=(SPAWN[r]||[]).slice();if(isNight())tab.push(['bat',1.1]);if(!tab.length)continue;
    const tot=tab.reduce((s,a)=>s+a[1],0);let k=Math.random()*tot,type=tab[0][0];for(const[n,w]of tab){if((k-=w)<=0){type=n;break}}
    const pack=type==='wolf'||type==='slime'||type==='spider'?rint(1,3):type==='bat'||type==='crab'||type==='bandit'?rint(1,2):1;
    for(let i=0;i<pack;i++)spawnEnemy(type,x+rnd(-30,30),y+rnd(-30,30),r);
    return;
  }
}
function moveEnt(e,dx,dy,fly){
  if(fly){e.x+=dx;e.y+=dy;e.x=clamp(e.x,3*T,(W-3)*T);e.y=clamp(e.y,3*T,(H-3)*T);return}
  const r=e.r*.75;
  const ok=(x,y)=>walkable(x-r,y-r*.5)&&walkable(x+r,y-r*.5)&&walkable(x-r,y+r*.6)&&walkable(x+r,y+r*.6);
  if(ok(e.x+dx,e.y))e.x+=dx;else e.blocked=true;
  if(ok(e.x,e.y+dy))e.y+=dy;else e.blocked=true;
}

function updateBoss(e,dt,d,ax,ay){
  if(dist(e.x,e.y,e.ax*T,e.ay*T)>16*T||dist(P.x,P.y,e.ax*T,e.ay*T)>18*T||P.dead){e.dead=true;bossActive[e.type]=false;toast(BOSSES[e.type].title+' retreats','Its wounds close','#ff6b6b');return}
  if(e.type==='hollow')updateHollow(e,dt,d,ax,ay);else updateWyrm(e,dt,d,ax,ay);
}

function updateWyrm(e,dt,d,ax,ay){

let bossActive={};

  e.hp-=dmg;e.flash=1;e.aggro=true;const kb=e.boss?0:e.type==='golem'?120:300;e.kx+=ax*kb;e.ky+=ay*kb;

function findTarget(){
  if(!P||P.dead)return null;
  const fx=P.x+P.fx*26,fy=P.y+P.fy*22;let best=null,bd=1e9;
  for(const n of npcs){const d=dist(P.x,P.y,n.x,n.y);if(d<64&&d<bd){bd=d;best={k:'npc',o:n,x:n.x,y:n.y-46,label:'Talk to '+n.name}}}
  if(best)return best;
  const tx=Math.floor(P.x/T),ty=Math.floor(P.y/T);
  for(let y=ty-2;y<=ty+2;y++)for(let x=tx-2;x<=tx+2;x++){const o=grid[y*W+x];if(!o)continue;
    let ox=o.x,oy=o.y;if(o.type==='house')continue;if(o.type==='stall'){ox=o.x;oy=o.y}
    const d=Math.min(dist(fx,fy,ox,oy),dist(P.x,P.y,ox,oy)+10);if(d>(o.type==='stall'?70:52)||d>=bd)continue;
    let label=null;
    if(o.type==='tree'&&!o.stump)label='Chop '+(o.kind==='dead'?'dead tree':'tree');
    else if(o.type==='rock'&&!o.gone)label='Mine '+ITEMS[o.ore].n;
    else if(o.type==='herb'&&!o.gone)label='Pick Redleaf';
    else if(o.type==='glowcap'&&!o.gone)label='Pick Glowcap';
    else if(o.type==='chest'&&!o.open)label='Open chest';
    else if(o.type==='anvil')label='Use forge';
    else if(o.type==='cauldron')label='Brew potions';
    else if(o.type==='campfire')label='Cook at the fire';
    else if(o.type==='well')label='Drink from the well';
    else if(o.type==='board')label='Read the notice board';
    else if(o.type==='stall')label='Browse the stall';
    if(label){bd=d;best={k:'obj',o,x:ox,y:oy-(o.type==='tree'?70:40),label}}
  }
  if(best)return best;
  for(const dd of[34,54,74]){const wx=P.x+P.fx*dd,wy=P.y+P.fy*dd+6,t=tileAt(Math.floor(wx/T),Math.floor(wy/T));if(t===WATER||t===DEEP)return{k:'fish',x:wx,y:wy,label:'Cast your line'}}
  return null;
}

function rollFish(ocean){
  const l=P.sk.fishing.l,lure=P.own.lure?1:0,night=isNight(),wet=rain.on?1:0;
  const tab=ocean?[['minnow',25],['bass',45],['salmon',15],['koi',2+lure*3+wet*2],['angler',night?6+lure*4:0]]

  const tot=tab.reduce((s,a)=>s+a[1],0);let k=Math.random()*tot;for(const[n,w]of tab){if((k-=w)<=0)return n}return'minnow';
}
const FISHDIFF={minnow:[.2,1],trout:[.16,1.2],bass:[.15,1.25],salmon:[.13,1.4],koi:[.09,1.7],angler:[.085,1.8],moonfin:[.065,2.1]};

      toast('Caught a '+ITEMS[id].n+'!',id==='moonfin'?'A legend of the lake!':id==='koi'||id==='angler'?'A rare catch!':'+'+ITEMS[id].v+' gold value',id==='moonfin'||id==='koi'?'#ffd23f':'#7fd6ff');SFX.catch();

    case'close':closePanel();break;
    case'equip':P.weapon=id;toast('Equipped '+WEAPONS[id].n,'','#f0b94a');openBag();save();break;
    case'slot':{const[sid,si]=id.split(':');const i=+si;const prev=P.slots.indexOf(sid);if(P.slots[i]===sid)P.slots[i]=null;else{if(prev>=0)P.slots[prev]=P.slots[i];P.slots[i]=sid}openSpells(panel==='spells:learn');save();break}
    case'learn':{const sp=SPELLS[id];if(P.lvl<sp.lv||P.gold<sp.price||P.spells.includes(id))return;P.gold-=sp.price;P.spells.push(id);const free=P.slots.indexOf(null);if(free>=0)P.slots[free]=id;
      toast('Learned '+sp.n+'!',free>=0?'Placed in slot '+(free+1):'Open your spellbook (B) to slot it','#c8b4ff');SFX.level();if(P.spells.length>=Object.keys(SPELLS).length)unlock('archmage');openSpells(true);save();break}
    case'use':usePotion(id);openBag();break;
    case'qtab':openQuests(id);break;
    case'craft':craft(id);break;
    case'stab':openShop(id);break;
    case'buy':{const s=SHOP[+id];if(P.gold<s.price)return;P.gold-=s.price;if(s.wpn){addWeapon(s.wpn)}else if(s.sp){P.own[s.sp]=1;toast(s.n+' acquired!',s.d,'#ffd23f');if(s.sp==='pet'){pet={x:P.x-30,y:P.y,cd:0,anim:0,fx:1};unlock('pet')}}else{addItem(s.id);}SFX.coin();openShop('buy');save();break}
    case'sell':P.inv[id]--;P.gold+=ITEMS[id].v;if(!P.inv[id])delete P.inv[id];SFX.coin();openShop('sell');break;
    case'sellall':P.gold+=ITEMS[id].v*P.inv[id];delete P.inv[id];SFX.coin();openShop('sell');break;
    case'accept':acceptQ(id);break;
    case'turnin':turnIn(id);break;
    case'svc':if(id==='forge')openCraft('forge');else if(id==='cauldron')openCraft('cauldron');else if(id==='shop')openShop('buy');else if(id==='magic')openSpells(true);else{const el=document.getElementById('say');if(el)el.textContent=pick(LINES[talkNPC.id])}break;
    case'respawn':respawn();break;
    case'reset':if(overlay.querySelector('[data-act="reset2"]'))return;overlay.querySelector('[data-act="reset"]').insertAdjacentHTML('afterend','<span class="sub">This erases your save.</span><button class="btn sm" data-act="reset2">Yes, start over</button>');break;
    case'reset2':try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload();break;
  }
}
overlay.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a){if(e.target===overlay)closePanel();return}handleAct(a.dataset.act,a.dataset.id)});
function showDeath(){panel='dead';const lost=Math.floor(P.gold*.1);P.deathLoss=lost;overlay.innerHTML=`<div class="panel narrow" id="dead" role="dialog"><h2>You have fallen</h2><p>The villagers carry you back to Emberfall. You drop <b class="reward">${lost} gold</b> on the way.</p><p class="sub">Tip: dash through attacks with Shift, and keep potions on hand.</p><div class="row" style="margin-top:12px"><button class="btn" data-act="respawn">Rise again</button></div></div>`;overlay.hidden=false}
function respawn(){P.gold-=P.deathLoss||0;P.dead=false;const S=stats();P.hp=S.maxHp;P.mp=S.maxMp;P.x=(VX+.5)*T;P.y=(VY+1.6)*T;P.iT=2;enemies=enemies.filter(e=>!e.boss);bossActive={};teles=[];projectiles=[];allies=[];clouds=[];if(pet){pet.x=P.x;pet.y=P.y}panel=null;overlay.hidden=true;overlay.innerHTML='';save()}

/* ---------- input ---------- */
let touchMode=false;
function enableTouch(){if(touchMode)return;touchMode=true;if(state==='play')document.getElementById('touch').hidden=false}
addEventListener('keydown',e=>{
  initAudio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  if(state!=='play')return;
  if(e.code==='Escape'){if(panel)closePanel();else openHelp();return}
  if(panel){if((e.code==='KeyI'&&panel==='bag')||(e.code==='KeyL'&&panel==='quests')||(e.code==='KeyM'&&panel==='map')||(e.code==='KeyH'&&panel==='help')||(e.code==='KeyB'&&panel&&panel.startsWith('spells')))closePanel();return}
  if(e.repeat&&e.code!=='Space'){keys[e.code]=true;return}
  keys[e.code]=true;
  if(P.fish&&(e.code==='KeyE'||e.code==='Space')){fishPress();keys.Space=false;return}
  switch(e.code){case'KeyE':interact();break;case'KeyF':case'KeyK':doSkill();break;case'ShiftLeft':case'ShiftRight':doDash();break;case'KeyQ':usePotion('hpot');break;case'KeyR':usePotion('mpot');break;
    case'Digit1':castSpell(0);break;case'Digit2':castSpell(1);break;case'Digit3':castSpell(2);break;case'KeyB':openSpells();break;
    case'KeyI':case'Tab':openBag();break;case'KeyL':openQuests();break;case'KeyM':openMap();break;case'KeyH':openHelp();break}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseHeld=false;joy.on=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  initAudio();if(state!=='play'||panel)return;
  if(e.pointerType==='touch'){enableTouch();if(e.clientX<cw*.55&&!joy.on){joy={on:true,id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY}}return}
  const wx=(e.clientX-cw/2)/zoom+cam.x,wy=(e.clientY-ch/2)/zoom+cam.y;const a=Math.atan2(wy-(P.y-10),wx-P.x);mouseAim={a,t:.35};
  if(P.fish){fishPress();return}
  if(e.button===2){doSkill()}else{mouseHeld=true;if(P.atkCd<=0)doAttack()}
});
addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}else if(mouseHeld&&e.pointerType==='mouse'){const wx=(e.clientX-cw/2)/zoom+cam.x,wy=(e.clientY-ch/2)/zoom+cam.y;mouseAim={a:Math.atan2(wy-(P.y-10),wx-P.x),t:.35}}});
addEventListener('pointerup',e=>{if(joy.on&&e.pointerId===joy.id)joy.on=false;if(e.pointerType==='mouse')mouseHeld=false});
addEventListener('pointercancel',e=>{if(joy.on&&e.pointerId===joy.id)joy.on=false});
document.querySelectorAll('#touch button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();if(state!=='play'||panel)return;const t=b.dataset.t;
    if(t==='atk'){if(P.fish){fishPress();return}keys.Space=true}else if(t==='skill')doSkill();else if(t==='dash')doDash();else if(t==='use')interact();else if(t[0]==='s')castSpell(+t[1]);else if(t==='pot')usePotion('hpot');else if(t==='mp')usePotion('mpot')});
  const up=()=>{if(b.dataset.t==='atk')keys.Space=false};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
});
document.getElementById('menu').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||state!=='play')return;initAudio();const m=b.dataset.m;
  if(m==='bag')openBag();else if(m==='spells')openSpells();else if(m==='quests')openQuests();else if(m==='map')openMap();else if(m==='help')openHelp();else if(m==='sound'){soundOn=!soundOn;b.textContent=soundOn?'Sound':'Muted'}b.blur()});

/* ---------- title ---------- */
function buildTitle(){
  const wrap=document.getElementById('classes');
  wrap.innerHTML=Object.entries(CLASSES).map(([k,c])=>`<button class="cls" data-cls="${k}"><canvas width="152" height="176" data-c="${k}"></canvas><div><b>${c.n}</b><span>${c.desc}</span><em>Skill: ${c.sk}</em></div></button>`).join('');
  wrap.querySelectorAll('canvas').forEach(c=>{const g=c.getContext('2d');g.scale(2,2);const k=c.dataset.c,cl=CLASSES[k];glow(g,38,60,40,cl.body,.35);drawHumanoid(g,38,66,{body:cl.body,trim:cl.trim,hat:cl.hat,hair:cl.hair,weapon:{warrior:'sword',mage:'staff',ranger:'bow'}[k],tier:1,fx:.2,fy:1,cape:shade(cl.body,-.3)})});
  wrap.addEventListener('click',e=>{const b=e.target.closest('[data-cls]');if(b){initAudio();SFX.quest();startGame(b.dataset.cls)}});
  const sv=readSave(),cont=document.getElementById('cont');
  if(sv&&sv.P){cont.innerHTML=`<button class="btn" id="contBtn">Continue · ${CLASSES[sv.P.cls].n} level ${sv.P.lvl}</button><span class="hint">or choose a class below for a new game</span>`;document.getElementById('contBtn').onclick=()=>{initAudio();SFX.quest();startGame(null,sv)}}
}
function startGame(cls,data){
  enemies=[];projectiles=[];pickups=[];pet=null;bossActive={};allies=[];clouds=[];teles=[];
  if(data){loadData(data)}else{P=newPlayer(cls);explored.fill(0);resetFog();chests.forEach(c=>c.open=false);try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
  state='play';document.getElementById('title').hidden=true;document.getElementById('menu').hidden=false;if(touchMode)document.getElementById('touch').hidden=false;
  cam.x=P.x;cam.y=P.y;lastRegion=null;
  if(!data){setTimeout(()=>{banner={title:'Emberfall',sub:'Talk to Elder Mira, the villager with the gold !',t:0}},400)}
  cv.focus();save();
}

/* ---------- loop ---------- */
let last=performance.now(),saveT=0,titleA=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    if(state==='play'&&!panel){updatePlay(dt)}
    updateWorld(state==='play'&&panel?0:dt);
    if(state==='play'){cam.x=lerp(cam.x,P.x,1-Math.pow(.0005,dt));cam.y=lerp(cam.y,P.y-10,1-Math.pow(.0005,dt));saveT+=dt;if(saveT>20){saveT=0;save()}}
    else{titleA+=dt*.05;cam.x=(VX+Math.cos(titleA)*14)*T;cam.y=(VY+4+Math.sin(titleA*1.3)*8)*T}
    const vw=cw/zoom/2,vh=ch/zoom/2;cam.x=clamp(cam.x,Math.min(vw,W*T/2),Math.max(W*T-vw,W*T/2));cam.y=clamp(cam.y,Math.min(vh,H*T/2),Math.max(H*T-vh,H*T/2));
    shake=Math.max(0,shake-dt*2);hurtFlash=Math.max(0,hurtFlash-dt*1.5);
    music(dt);render();
  }catch(err){console.error(err)}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function boot(data){
  resize();genMap();placeObjects();buildMinimap();makeNPCs();buildTitle();
  if(matchMedia('(pointer: coarse)').matches)enableTouch();
  if(data&&data.save){startGame(null,data.save)}
  requestAnimationFrame(t=>{last=t;frame(t)});
}
window.claude?.hot?.snapshot?.(()=>({save:state==='play'?serialize():null}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
