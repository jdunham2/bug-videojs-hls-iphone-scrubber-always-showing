<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draw &amp; Release</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="hud">
      <div id="hud-top-left">
        <div class="hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
        <div id="dodge" class="dodge"><div id="dodge-fill"></div><span>DODGE</span></div>
        <div id="ult" class="ult"><div id="ult-fill"></div><span>ARROW STORM · Q</span></div>
        <div id="stats"></div>
        <div id="gems">◆ 0</div>
        <div id="build"></div>
      </div>
      <div id="hud-top-right">
        <div id="wave-label"></div>
        <div id="enemies-label"></div>
        <div id="streak"></div>
      </div>
      <div id="banner"></div>
      <div id="boss-bar"><div id="boss-name"></div><div class="track"><div id="boss-fill"></div></div><div class="poise"><div id="boss-poise"></div></div></div>
      <div id="boss-card"></div>
      <div id="numbers"></div>
      <div id="reticle"><div class="ring"></div><div class="dot"></div></div>
      <div id="hint">WASD move · Hold LMB to draw · Release in the gold flash · Space / RMB dodge · ` tuning · P pause · M mute · R restart</div>
    </div>
    <div id="camp-hud"><div id="camp-gems">◆ 0</div><div class="hint">WASD walk · <kbd>E</kbd> use buildings · Hall of Heroes, Tailor's Tent, Rune Shrine, Ruin Gate</div></div>
    <div id="camp-prompt"></div>
    <div id="camp-panel"></div>
    <div id="tip"></div>
    <div id="fade"></div>
    <button id="settings-btn" aria-label="Settings">⚙</button>
    <div id="settings"></div>
    <div id="draft"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
