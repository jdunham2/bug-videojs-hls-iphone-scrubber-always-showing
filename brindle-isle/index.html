<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brindle Isle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-bleed canvas world, HUD floats in the corners like a field journal pinned over the map. */
:root {
  --night: #12232a;      /* panel ground */
  --night-2: #1c343c;    /* raised rows */
  --line: #2e5059;       /* borders */
  --text: #eef3e6;       /* main text */
  --muted: #9fb7b0;      /* secondary text */
  --gold: #f4b740;       /* money / primary action */
  --heart: #ec5257;      /* health */
  --crystal: #a593ff;    /* rare resource accent */
  --ok: #7fd17a;
  --display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #1d4e6b; color: var(--text); font-family: var(--body); font-size: 14px; }
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

.card { background: color-mix(in srgb, var(--night) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }

#hud { position: fixed; inset: 0; pointer-events: none; }
.hud-top {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;
}
.stats { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
#hearts { font-size: 20px; letter-spacing: 1px; line-height: 1; }
#hearts .on { color: var(--heart); }
#hearts .off { color: #3c4f55; }
.gold { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 20px; color: var(--gold); font-variant-numeric: tabular-nums; }
.gold img { width: 20px; height: 20px; image-rendering: pixelated; }
.objective { padding: 8px 12px; flex: 1 1 260px; max-width: 420px; min-width: 0; }
.label { font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#objective { margin: 2px 0 6px; line-height: 1.35; }
.bar { height: 8px; border-radius: 4px; background: #0b171b; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
#minimap { margin-left: auto; width: 144px; height: 112px; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0,0,0,.25); image-rendering: pixelated; }
#helpBtn { pointer-events: auto; position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 130px); width: 36px; height: 36px; border-radius: 50%; background: var(--night); border: 1px solid var(--line); font-family: var(--display); font-size: 18px; }

#inventory {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; gap: 4px; padding: 6px; pointer-events: auto; max-width: calc(100vw - 24px); overflow-x: auto;
}
.slot { position: relative; width: 42px; height: 42px; border-radius: 8px; background: var(--night-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; padding: 0; }
.slot img { width: 28px; height: 28px; image-rendering: pixelated; }
.slot b { position: absolute; right: 3px; bottom: 1px; font-family: var(--display); font-size: 13px; text-shadow: 0 1px 0 #000; font-variant-numeric: tabular-nums; }
.slot.zero { opacity: .35; }
.slot.tool { border-color: var(--crystal); }
#prompt { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); padding: 6px 12px; font-family: var(--display); font-size: 15px; white-space: nowrap; }
#prompt kbd { background: var(--gold); color: #2a1a00; border-radius: 4px; padding: 0 6px; font-family: inherit; }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 140px); transform: translate(-50%, -8px); padding: 8px 14px; max-width: min(90vw, 440px); text-align: center; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

#dialogue { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(560px, calc(100vw - 24px)); box-sizing: border-box; padding: 14px 16px 10px; cursor: pointer; z-index: 5; }
#dlgWho { font-family: var(--display); font-size: 16px; color: var(--gold); margin-bottom: 4px; }
#dlgText { font-size: 16px; line-height: 1.45; min-height: 3em; }
.hint { color: var(--muted); font-size: 12px; text-align: right; margin-top: 6px; }

#panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 12, 15, .55); z-index: 6; padding: 16px; box-sizing: border-box; }
.sheet { width: min(520px, 100%); max-height: calc(100% - 20px); overflow-y: auto; padding: 16px; box-sizing: border-box; outline: none; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--night-2); border-radius: 8px; }
.row > img { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.row .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .meta span { color: var(--muted); font-size: 13px; }
.row.empty { opacity: .5; }
.costs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.cost { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; }
.cost img { width: 18px; height: 18px; image-rendering: pixelated; }
.cost.ok { color: var(--ok); }
.cost.no { color: #f08a7e; }
.btn, .sheet header button, .row button { background: #29464e; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; flex: none; }
.btn:disabled, .row button:disabled { opacity: .4; cursor: default; }
.primary { background: var(--gold) !important; color: #2a1a00; border: 0 !important; font-weight: 700; border-radius: 8px; padding: 10px 14px; width: 100%; margin-bottom: 10px; }
.primary:disabled { opacity: .45; cursor: default; }
.fund { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; font-family: var(--display); font-size: 18px; color: var(--gold); }
.fund .bar { flex: 1; height: 12px; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; }
.controls dt { font-family: var(--display); color: var(--gold); }
.controls dd { margin: 0; color: var(--text); }

#victory { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 12, 15, .6); z-index: 7; padding: 16px; }
#victory .sheet { text-align: center; }
#victory h2 { font-size: 34px; color: var(--gold); margin: 4px 0 8px; }

#touch { display: none; }
@media (pointer: coarse) {
  #touch { display: block; position: fixed; inset: auto 0 0 0; height: 0; z-index: 4; }
  #stick { position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: 120px; height: 120px; border-radius: 50%; background: rgba(18,35,42,.45); border: 2px solid rgba(238,243,230,.25); touch-action: none; }
  #nub { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(238,243,230,.55); }
  .tbtns { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); display: flex; gap: 12px; align-items: flex-end; }
  .tbtns button { touch-action: none; border-radius: 50%; border: 2px solid rgba(0,0,0,.3); font-family: var(--display); }
  #btnA { width: 78px; height: 78px; background: var(--gold); color: #2a1a00; font-size: 26px; }
  #btnTonic { width: 54px; height: 54px; background: #c2477a; font-size: 12px; }
  #btnB { width: 62px; height: 62px; background: #3d8fd1; color: #fff; font-size: 13px; margin-bottom: 30px; }
  #inventory { bottom: calc(env(safe-area-inset-bottom, 0px) + 156px); }
  #prompt { bottom: calc(env(safe-area-inset-bottom, 0px) + 216px); }
  #bossbar { bottom: calc(env(safe-area-inset-bottom, 0px) + 210px); }
}
@media (max-width: 560px) {
  #minimap { width: 100px; height: 78px; }
  #helpBtn { top: calc(env(safe-area-inset-top, 0px) + 96px); }
  #questBtn { top: calc(env(safe-area-inset-top, 0px) + 96px); }
  .objective { order: 3; flex-basis: 100%; max-width: none; }
  #hearts { font-size: 17px; }
}
.credits { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.5; }
.credits b { color: var(--text); }
#bossbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); width: min(440px, calc(100vw - 24px)); box-sizing: border-box; padding: 8px 12px; z-index: 3; pointer-events: none; }
#bossbar .label { color: #ff9a9a; }
#bossbar .bar { height: 12px; margin-top: 4px; }
#bossbar .bar i { width: 100%; background: linear-gradient(90deg, #5fd0b0, #b05cff); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tab { background: #29464e; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-family: var(--display); }
.tab.on { background: var(--gold); color: #2a1a00; border-color: var(--gold); }
.row.eq { outline: 2px solid var(--gold); }
.row .meta small { color: var(--gold); font-weight: 400; margin-left: 4px; }
#qtrack { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
#qtrack b { color: var(--text); font-weight: 700; }
#qtrack .qdone, #qtrack .qdone b { color: #7fe07a; }
#qtrack:empty { display: none; }
#questBtn { pointer-events: auto; position: absolute; right: max(56px, calc(env(safe-area-inset-right, 0px) + 56px)); top: calc(env(safe-area-inset-top, 0px) + 130px); height: 36px; padding: 0 12px; border-radius: 18px; background: var(--night); border: 1px solid var(--line); font-family: var(--display); font-size: 14px; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes shakeX { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.bump { animation: bump .25s ease-out; }
#hearts.hit { animation: shakeX .35s; }
@media (prefers-reduced-motion: reduce) { #toast, .bar i { transition: none; } .bump, #hearts.hit { animation: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Brindle Isle game world"></canvas>

<div id="hud">
  <div class="hud-top">
    <div class="stats card">
      <div id="hearts" aria-label="Health"></div>
      <div class="gold"><img id="coinIcon" alt=""><span id="gold">0</span></div>
    </div>
    <div class="objective card">
      <div class="label">Goal · Rebuild the south bridge</div>
      <div id="objective"></div>
      <div class="bar"><i id="fund"></i></div>
      <div id="qtrack"></div>
    </div>
    <canvas id="minimap" width="144" height="112" aria-label="Island map"></canvas>
  </div>
  <button id="helpBtn" aria-label="Controls and options">?</button>
  <button id="questBtn" aria-label="Quest log">Quests</button>
  <div id="prompt" class="card" hidden></div>
  <div id="inventory" class="card"></div>
</div>

<div id="bossbar" class="card" hidden><div class="label">The Slime King</div><div class="bar"><i id="bossfill"></i></div></div>
<div id="toast" class="card" role="status"></div>

<div id="dialogue" class="card" hidden>
  <div id="dlgWho"></div>
  <div id="dlgText"></div>
  <div class="hint">Space or tap to continue</div>
</div>

<div id="panel" hidden>
  <div class="sheet card" tabindex="-1">
    <header><h2 id="panelTitle"></h2><button id="panelClose">Close</button></header>
    <div id="panelBody"></div>
  </div>
</div>

<div id="victory" hidden>
  <div class="sheet card">
    <div class="label">Chapter one complete</div>
    <h2>The bridge is open</h2>
    <p class="sub" id="victoryStats"></p>
    <button class="primary" id="victoryBtn">Keep exploring</button>
  </div>
</div>

<div id="touch">
  <div id="stick"><div id="nub"></div></div>
  <div class="tbtns"><button id="btnTonic">Tonic</button><button id="btnB" aria-label="Dash">Dash</button><button id="btnA" aria-label="Action. Hold to charge a Whirlwind">A</button></div>
</div>

// ---------- sound: tiny synthesized effects, no audio files ----------
const SFX = (() => {
  let ac = null, muted = false;
  try { muted = localStorage.getItem('brindle-mute') === '1'; } catch (_) {}
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; } }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(a, f, dur, type = 'square', vol = 0.06, slide = 0, delay = 0) {
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(a, dur, vol, freq, delay = 0) {
    const t0 = a.currentTime + delay, len = Math.ceil(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(a.destination); src.start(t0);
  }

    swing: a => noise(a, 0.13, 0.18, 2200),
    hit: a => { tone(a, 200, 0.1, 'square', 0.06, -110); noise(a, 0.06, 0.12, 1200); },
    chop: a => { tone(a, 150, 0.09, 'triangle', 0.14, -70); noise(a, 0.07, 0.14, 800); },
    mine: a => { tone(a, 1200, 0.06, 'square', 0.035); noise(a, 0.07, 0.14, 3500); },
    pick: a => tone(a, 520, 0.08, 'triangle', 0.08, 320),
    collect: a => tone(a, 880, 0.06, 'triangle', 0.05, 220),
    coin: a => { tone(a, 988, 0.06, 'square', 0.035); tone(a, 1319, 0.12, 'square', 0.035, 0, 0.06); },
    hurt: a => tone(a, 330, 0.25, 'sawtooth', 0.07, -220),
    special: a => [523, 659, 784, 1047].forEach((f, i) => tone(a, f, 0.1, 'square', 0.04, 0, i * 0.05)),
    dash: a => noise(a, 0.18, 0.12, 700),

    crumble: a => { noise(a, 0.3, 0.16, 1500); noise(a, 0.2, 0.1, 500, 0.08); },
    slime: a => tone(a, 160, 0.16, 'sine', 0.14, 260),
    craft: a => [392, 523, 659, 784].forEach((f, i) => tone(a, f, 0.14, 'triangle', 0.07, 0, i * 0.08)),
    lucky: a => [1047, 1319, 1568].forEach((f, i) => tone(a, f, 0.1, 'square', 0.03, 0, i * 0.05)),
    drink: a => [300, 420, 360, 520].forEach((f, i) => tone(a, f, 0.07, 'sine', 0.08, 80, i * 0.09)),
    leap: a => tone(a, 260, 0.16, 'triangle', 0.07, 260),
    thud: a => { tone(a, 70, 0.25, 'sine', 0.22, -30); noise(a, 0.15, 0.1, 300); },
    slam: a => { tone(a, 55, 0.5, 'sine', 0.3, -25); noise(a, 0.45, 0.2, 250); },
    boss: a => [196, 185, 175, 147].forEach((f, i) => tone(a, f, 0.32, 'sawtooth', 0.06, 0, i * 0.22)),

  };

    play(n) { if (muted) return; const a = audio(); if (a && FX[n]) try { FX[n](a); } catch (_) {} },
    get muted() { return muted; },

// ---------- random + noise ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(SEED);
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + SEED * 1013904223) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const s = t => t * t * (3 - 2 * t), u = s(xf), v = s(yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function render() {

// ---------- save / load ----------

// ---------- boot ----------
function loadImages() {

}
async function start(hot) {

      'The storm passed in the night. You wake on a small island village.',
      'The only bridge to the mainland was swept away. Rebuilding it will cost 400 gold.',
      'Gather, craft, and trade your way there. Oma Fen, by the cottage, is a good place to start.',
    ], () => toast('Special moves: hit 3 times in a row for a finisher, hold Space to charge a Whirlwind, Shift to dash.', 6000));

}

})();
