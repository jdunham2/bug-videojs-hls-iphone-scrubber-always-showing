<title>Mischief Lane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: full-bleed canvas world; HUD plates float in the corners, clear of safe areas. */
  :root {
    --ground: #3f6b33;      /* forest floor behind the canvas */
    --plate: rgba(28, 36, 24, 0.78);
    --plate-edge: rgba(255, 244, 214, 0.18);
    --ink: #fff4d6;         /* warm parchment text */
    --ink-dim: #d8cba8;
    --accent: #ffb547;      /* lantern orange */
    --font-display: "Chewy", "Comic Sans MS", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    background: var(--plate);
    border: 1px solid var(--plate-edge);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    line-height: 1.45;
    max-width: calc(100vw - 24px);
    pointer-events: none;
  }
  .hud h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  .hud .keys { color: var(--ink-dim); }
  kbd {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 11px;
    background: rgba(255, 244, 214, 0.12);
    border: 1px solid var(--plate-edge);
    border-radius: 4px;
    padding: 0 4px;
    color: var(--ink);
  }
  [hidden] { display: none !important; }
  .touch-only { display: none !important; }
  @media (pointer: coarse) {
    .touch-only { display: inline-block !important; }
    .desktop-only { display: none !important; }
  }

  #chitter {
    position: fixed;
    right: calc(20px + env(safe-area-inset-right, 0px));
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 76px; height: 76px;
    border-radius: 50%;
    border: 2px solid var(--plate-edge);
    background: var(--plate);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 18px;
    display: none;
  }
  @media (pointer: coarse) { #chitter { display: block; } }
  #chitter:active { transform: scale(0.94); }

  #start {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(20, 30, 16, 0.35), rgba(20, 30, 16, 0.75));
    cursor: pointer;
  }
  #start .card { text-align: center; padding: 24px 28px; max-width: 420px; }
  #start h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(44px, 11vw, 80px);
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 4px 0 #6b3d10, 0 8px 24px rgba(0,0,0,0.4);
    text-wrap: balance;
  }
  #start p { margin: 14px 0 0; font-size: 16px; color: var(--ink); }
  #start .go {
    display: inline-block; margin-top: 22px;
    font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { #start .go { animation: none; } }
</style>

<canvas id="game" aria-label="Mischief Lane game world"></canvas>

<div class="hud" id="hud">
  <h1>Mischief Lane</h1>
  <div class="keys desktop-only"><kbd>WASD</kbd>/<kbd>Arrows</kbd> walk · <kbd>Shift</kbd> run · <kbd>Space</kbd> chitter · <kbd>M</kbd> map</div>
  <div class="keys touch-only">Drag anywhere to walk · push far to run</div>
</div>

<button id="chitter" type="button" aria-label="Chitter">chitter</button>

<div id="start" role="button" tabindex="0" aria-label="Start game">
  <div class="card">
    <h2>Mischief Lane</h2>
    <p>You're a raccoon. There's a whole village. Nobody's watching.</p>
    <span class="go desktop-only">Press any key to start</span>
    <span class="go touch-only">Tap to start</span>
  </div>
</div>

<script src="game.js"></script>
